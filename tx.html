<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TX</title>
<style>
/* operator console for DEVICE: one column, big touch targets, current mode on top */
:root{
  --paper:#fff;
  --ink:#0A0B0C;
  --mute:#6B7075;
  --line:#E2E4E6;
  --soft:#F2F3F4;
  --live:#1F9D55;
  --warn:#C2410C;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);color:var(--ink);
  font:400 15px/1.5 var(--font);letter-spacing:-.01em;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.status.ok .dot{background:var(--live)}
.status.bad .dot{background:var(--warn)}
.status.bad{color:var(--warn)}
.link{background:none;border:0;padding:4px 0;color:var(--mute);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.err{color:var(--warn);font-size:14px;min-height:1.5em;margin:0}

/* current mode */
.now{border:1px solid var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.now-label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.now-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.now-mode{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.now-chapter{font-size:14px;color:var(--mute)}
.now-timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.now-timer small{font-size:13px;font-weight:400;color:var(--mute);margin-left:4px}
.now-desc{margin:4px 0 0;color:var(--ink)}

.next{
  width:100%;padding:18px;border:0;border-radius:14px;background:var(--ink);color:var(--paper);
  font-size:19px;font-weight:700;cursor:pointer;letter-spacing:-.02em;
}
.next:disabled{background:var(--soft);color:var(--mute);cursor:default}
.next:not(:disabled):active{transform:scale(.99)}

/* mode list */
.list-title{margin:0;font-size:13px;color:var(--mute)}
.modes{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.modes li+li{border-top:1px solid var(--line)}
.mode{
  width:100%;display:grid;grid-template-columns:36px 1fr;gap:4px 12px;align-items:start;
  padding:14px 16px;border:0;background:var(--paper);text-align:left;cursor:pointer;
}
.mode:hover{background:var(--soft)}
.mode .n{grid-row:span 2;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.mode .ch{font-size:12px;color:var(--mute)}
.ch-t{font-weight:700;color:var(--ink)}
.mode[aria-current="true"] .ch-t{color:var(--paper)}
.mode .d{font-size:14px;min-width:0}
.mode[aria-current="true"]{background:var(--ink);color:var(--paper)}
.mode[aria-current="true"] .ch{color:#B9BDC1}

/* personal numbers in use + reset between shows */
.seats{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.seats-count{margin:2px 0 0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}

/* mode 7: open the numbers one by one, following the stage monitor */
.step7{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--ink);border-radius:14px}
.step7-nums{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.step7-nums li{min-width:52px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute)}
.step7-nums li.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.step7-row{display:flex;gap:10px;align-items:stretch}
.step7-row .next{flex:1;margin:0;white-space:nowrap}
.step7-row .btn{white-space:nowrap}

/* confirm bar for jumping straight to a mode */
.confirm{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--paper);border-top:1px solid var(--ink);
}
.confirm-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.confirm p{margin:0;flex:1;min-width:0;font-weight:700}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--ink);background:var(--paper);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>TX</h1>
    <div class="status" id="status" role="status"><span class="dot"></span><span id="status-text">연결 중</span></div>
  </header>

  <main id="console">
    <div style="display:flex;flex-direction:column;gap:20px">
      <section class="now" aria-label="현재 모드">
        <span class="now-label">지금 송출 중</span>
        <div class="now-row">
          <span class="now-mode" id="now-mode">–</span>
          <span class="now-timer" id="now-timer" hidden></span>
        </div>
        <span class="now-chapter" id="now-chapter"></span>
        <p class="now-desc" id="now-desc"></p>
      </section>

      <button class="next" id="next" type="button">다음 모드</button>
      <p class="err" id="err"></p>

      <section class="step7" id="step7" aria-label="모드 7 소리 열기" hidden>
        <h2 class="list-title">모드 7 · 소리 낼 번호 (모니터 순서)</h2>
        <ol class="step7-nums" id="step7-nums"></ol>
        <div class="step7-row">
          <button class="btn" id="step7-back" type="button">한 단계 뒤로</button>
          <button class="next" id="step7-next" type="button">다음 번호 열기</button>
        </div>
      </section>

      <section class="seats" aria-label="번호 선택 모드">
        <div>
          <h2 class="list-title">관객 번호 배정</h2>
          <p class="seats-count" id="pick-state">–</p>
        </div>
        <button class="btn" id="pick-toggle" type="button" aria-pressed="false">번호 선택 모드</button>
      </section>

      <h2 class="list-title">모드 직접 선택 (리허설·복구용)</h2>
      <ul class="modes" id="modes"></ul>

      <section class="seats" aria-label="관객 번호">
        <div>
          <h2 class="list-title">관객 번호</h2>
          <p class="seats-count" id="seats-count">–</p>
        </div>
        <button class="btn" id="reset-claims" type="button">번호 전체 초기화</button>
      </section>
    </div>
  </main>
</div>

<div class="confirm" id="confirm" hidden>
  <div class="confirm-in">
    <p id="confirm-text"></p>
    <button class="btn" id="confirm-no" type="button">취소</button>
    <button class="btn primary" id="confirm-yes" type="button">전환</button>
  </div>
</div>

<script>
(() => {
  // DEVICE table: what each mode does on the audience phones
  const MODES = [
    { n: 1, ch: "챕터 1", t: "공간파동", d: "미니패널: 각자 개인번호 1~40" },
    { n: 2, ch: "챕터 1", t: "공간파동", d: "스피커: 공연 안내 멘트" },
    { n: 3, ch: "챕터 1", t: "공간파동", d: "미니패널: 800초 카운트다운 시작" },
    { n: 4, ch: "챕터 1", t: "공간파동", d: "카운트다운 유지 · 스피커: 인물들의 파편적인 발화" },
    { n: 5, ch: "챕터 2", t: "빨간대문", d: "미니패널: 개인번호 · 스피커: 파편적인 발화" },
    { n: 6, ch: "챕터 2", t: "빨간대문", d: "미니패널 및 버튼 MUTE" },
    { n: 7, ch: "챕터 3", t: "빨간대문", d: "버튼 누르면 소리 · 개인번호 · 음계 단음" },
    { n: 8, ch: "챕터 3", t: "빨간대문", d: "버튼 누르면 소리 · 개인번호 옆 도형 ○ △ □ ☆ ✕ · 음계 단음" },
    { n: 9, ch: "챕터 3", t: "빨간대문", d: "버튼 누르면 소리 · 미니패널: 도형만 ○ △ □ ☆ ✕ · 음계 단음" },
    { n: 10, ch: "챕터 3", t: "빨간대문", d: "미니패널 꺼짐 · 전환 후 1초 유지 → 3초 페이드아웃 · 그동안 누른 소리도 같이 작아짐 · 이후엔 무음" },
    { n: 11, ch: "챕터 4", t: "빨간대문", d: "미니패널 꺼짐 · 버튼 누르면 번호마다 정해진 메인사운드 (9개 랜덤 배정)" },
    { n: 12, ch: "챕터 4", t: "빨간대문", d: "미니패널 꺼짐 · 버튼 누르면 띵동" },
  ];
  const $ = (id) => document.getElementById(id);
  // chapter label, plus the section title in bold where there is one (modes 1~4: 공간파동)
  const chLabel = (m) => m.ch + (m.t ? ` <b class="ch-t">${m.t}</b>` : "");
  let state = null, offset = 0, pending = null, busy = false;

  const setStatus = (ok, text) => {
    $("status").className = "status " + (ok ? "ok" : "bad");
    $("status-text").textContent = text;
  };

  async function call(method, body) {
    const t0 = Date.now();
    const r = await fetch("/api/state", {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store",
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.message || "요청 실패 (" + r.status + ")"), { status: r.status });
    offset = j.nowMs - (t0 + Date.now()) / 2; // server clock minus ours
    return j;
  }

  // list
  const list = $("modes");
  for (const m of MODES) {
    const li = document.createElement("li");
    li.innerHTML = `<button type="button" class="mode" data-n="${m.n}"><span class="n">${m.n}</span><span class="ch">${chLabel(m)}</span><span class="d">${m.d}</span></button>`;
    list.appendChild(li);
  }

  function render() {
    if (!state) return;
    const m = MODES[state.mode - 1];
    $("now-mode").textContent = "MODE " + state.mode;
    $("now-chapter").innerHTML = chLabel(m);
    $("now-desc").textContent = m.d;
    for (const b of list.querySelectorAll(".mode")) b.setAttribute("aria-current", String(+b.dataset.n === state.mode));
    const next = MODES[state.mode];
    $("next").disabled = !next || busy;
    $("next").textContent = next ? `다음 모드 → ${next.n}` : "마지막 모드입니다";
    renderStep7();
    tick();
  }

  // mode 7: 17 → 32 → 11 → 31 → 10 open one at a time (cumulative), then everyone
  const STEP7 = [17, 32, 11, 31, 10];
  function renderStep7() {
    const on = state.mode === 7;
    $("step7").hidden = !on;
    if (!on) return;
    const step = typeof state.step === "number" ? state.step : 0;
    const labels = [...STEP7.map((n) => String(n).padStart(2, "0")), "전체"];
    $("step7-nums").innerHTML = labels.map((t, i) => `<li class="${i < step ? "on" : ""}">${t}</li>`).join("");
    $("step7-next").textContent = step < 5 ? `${String(STEP7[step]).padStart(2, "0")}번 열기` : step === 5 ? "전체 해제" : "모두 소리 나는 중";
    $("step7-next").disabled = step >= 6 || busy;
    $("step7-back").disabled = step <= 0 || busy;
  }
  async function setStep(step) {
    busy = true; render();
    $("err").textContent = "";
    try {
      const r = await fetch("/api/step", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ step }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || "단계 전환 실패 (" + r.status + ")");
      state = j;
    } catch (e) { $("err").textContent = e.message; }
    finally { busy = false; render(); }
  }
  $("step7-next").addEventListener("click", () => { if (state && state.step < 6) setStep((state.step || 0) + 1); });
  $("step7-back").addEventListener("click", () => { if (state && state.step > 0) setStep(state.step - 1); });

  // remaining seconds, computed from the start time on the server's clock
  function tick() {
    const el = $("now-timer");
    const on = state && (state.mode === 3 || state.mode === 4) && state.timerStartedAtMs;
    el.hidden = !on;
    if (!on) return;
    const left = Math.max(0, Math.ceil(state.timerSeconds - (Date.now() + offset - state.timerStartedAtMs) / 1000));
    el.innerHTML = `${left}<small>초 남음</small>`;
  }
  setInterval(tick, 250);

  async function setMode(n) {
    busy = true; render();
    $("err").textContent = "";
    try {
      state = await call("POST", { mode: n });
      setStatus(true, "연결됨");
    } catch (e) {
      $("err").textContent = e.message;
    } finally {
      busy = false; render();
    }
  }

  async function refresh() {
    try {
      state = await call("GET");
      setStatus(true, "연결됨");
      render();
    } catch (e) {
      setStatus(false, "연결 끊김 · 다시 시도 중");
    }
  }

  $("next").addEventListener("click", () => { if (state && state.mode < MODES.length) setMode(state.mode + 1); });

  list.addEventListener("click", (e) => {
    const b = e.target.closest(".mode");
    if (!b || !state || +b.dataset.n === state.mode) return;
    pending = +b.dataset.n;
    $("confirm-text").textContent = `모드 ${pending}로 바로 전환할까요?`;
    $("confirm").hidden = false;
    $("confirm-yes").focus();
  });
  $("confirm-no").addEventListener("click", () => { pending = null; $("confirm").hidden = true; });
  $("confirm-yes").addEventListener("click", () => {
    const n = pending; pending = null; $("confirm").hidden = true;
    if (n === "reset") resetClaims();
    else if (n === "pick-on" || n === "pick-off") setPick(n === "pick-on");
    else if (n) setMode(n);
  });

  // audience numbers: how many of 1~40 are taken, and a reset for the next show
  async function refreshClaims() {
    try {
      const j = await (await fetch("/api/claims", { cache: "no-store" })).json();
      $("seats-count").textContent = `${j.taken.length} / 40 선택됨`;
      if (typeof j.pickMode === "boolean") renderPick(j.pickMode);
    } catch (_) {}
  }

  // 번호 선택 모드: ON = 관객이 /rx 오른쪽 위에서 번호를 직접 고름, OFF = 들어온 순서대로 자동 배정
  let pickMode = null;
  function renderPick(on) {
    pickMode = on;
    $("pick-state").textContent = on ? "직접 선택" : "선착순 자동";
    $("pick-toggle").textContent = on ? "번호 선택 모드 끄기" : "번호 선택 모드";
    $("pick-toggle").setAttribute("aria-pressed", String(on));
    $("pick-toggle").classList.toggle("primary", on);
  }
  async function setPick(on) {
    $("err").textContent = "";
    try {
      const r = await fetch("/api/pickmode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || "번호 선택 모드 전환 실패 (" + r.status + ")");
      renderPick(j.pickMode);
    } catch (e) { $("err").textContent = e.message; }
  }
  $("pick-toggle").addEventListener("click", () => {
    if (pickMode === null) return;
    pending = pickMode ? "pick-off" : "pick-on";
    $("confirm-text").textContent = pickMode
      ? "번호 선택 모드를 끌까요? 다시 선착순으로 배정돼요."
      : "관리자 확인용 옵션입니다. 번호를 선택할 수 있는 모드로 전환할까요?";
    $("confirm").hidden = false;
    $("confirm-yes").focus();
  });
  async function resetClaims() {
    $("err").textContent = "";
    try {
      const r = await fetch("/api/claims/reset", { method: "POST" });
      if (!r.ok) throw new Error("초기화 실패 (" + r.status + ")");
      refreshClaims();
    } catch (e) { $("err").textContent = e.message; }
  }
  $("reset-claims").addEventListener("click", () => {
    pending = "reset";
    $("confirm-text").textContent = "관객 번호를 모두 풀까요? 다들 다시 골라야 해요.";
    $("confirm").hidden = false;
    $("confirm-yes").focus();
  });

  setInterval(() => { refresh(); refreshClaims(); }, 3000); // stay in sync if another operator changes the mode
  refresh();
  refreshClaims();
})();
</script>
</body>
</html>
