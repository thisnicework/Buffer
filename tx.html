<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TX</title>
<style>
/* operator console for DEVICE: one column, big touch targets, current mode on top */
:root{
  --paper:#fff;
  --ink:#0A0B0C;
  --mute:#6B7075;
  --line:#E2E4E6;
  --soft:#F2F3F4;
  --live:#1F9D55;
  --warn:#C2410C;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);color:var(--ink);
  font:400 15px/1.5 var(--font);letter-spacing:-.01em;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.status.ok .dot{background:var(--live)}
.status.bad .dot{background:var(--warn)}
.status.bad{color:var(--warn)}
.link{background:none;border:0;padding:4px 0;color:var(--mute);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.err{color:var(--warn);font-size:14px;min-height:1.5em;margin:0}

/* current mode */
.now{border:1px solid var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.now-label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.now-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.now-mode{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.now-desc{margin:4px 0 0;color:var(--ink)}

.next{
  width:100%;padding:18px;border:0;border-radius:14px;background:var(--ink);color:var(--paper);
  font-size:19px;font-weight:700;cursor:pointer;letter-spacing:-.02em;
}
.next:disabled{background:var(--soft);color:var(--mute);cursor:default}
.next:not(:disabled):active{transform:scale(.99)}

/* mode list */
.list-title{margin:0;font-size:13px;color:var(--mute)}
.modes{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.modes li+li{border-top:1px solid var(--line)}
.mode{
  width:100%;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;
  padding:14px 16px;border:0;background:var(--paper);text-align:left;cursor:pointer;
}
.mode:hover{background:var(--soft)}
.mode .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.mode .d{font-size:14px;min-width:0}
.mode[aria-current="true"]{background:var(--ink);color:var(--paper)}

/* mode list with two views (tabs top-right of the title): 순서 = the saved cue order, A~O = letter order */
.mode-lists{display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{display:flex;padding:3px;border-radius:10px;background:var(--soft)}
.tabs button{padding:6px 14px;border:0;border-radius:8px;background:transparent;color:var(--mute);font-size:13px;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.view-ctrls{display:flex;align-items:center;gap:8px}
/* RUN: while it's on, a tap on any mode row switches the show to it at once (no confirm) */
.run{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--mute);font-size:13px;font-weight:800;letter-spacing:.04em;cursor:pointer}
.run[aria-pressed="true"]{background:#D92D20;border-color:#D92D20;color:#fff}
.mode-lists:not(.armed) .mode{cursor:default}
.mode-lists:not(.armed) .mode:hover{background:var(--paper)}
.mode-lists:not(.armed) .mode[aria-current="true"]:hover{background:var(--ink)}
.view{display:flex;flex-direction:column;gap:12px}
.order-btns{display:flex;gap:8px}
.order-btns .btn{padding:8px 12px;font-size:13px}
.order-btns .btn:disabled{border-color:var(--line);color:var(--mute);background:var(--paper);cursor:default}
.cue li{display:flex;align-items:stretch;background:var(--paper)}
.cue .mode{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:12px 4px 12px 14px}
.cue .pos{width:22px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.cue .n{width:24px;font-size:20px}
.cue .d{flex:1;min-width:0;font-size:14px}
.cue .now-tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--ink);color:var(--paper)}
.cue .mode[aria-current="true"] .pos{color:#B9BDC1}
.cue .mode[aria-current="true"] .now-tag{background:var(--paper);color:var(--ink)}
.cue li:has(.mode[aria-current="true"]) .grip{background:var(--ink);color:#B9BDC1}
.cue .del,.cue .dup{width:40px;flex:none;border:0;background:transparent;color:var(--mute);font-size:16px;cursor:pointer}
.cue .del:hover{color:#C53030}
.cue .dup:hover{color:var(--ink)}
.cue li:has(.mode[aria-current="true"]) :is(.del,.dup){background:var(--ink);color:#B9BDC1}
.cue .rename{flex:1;min-width:0;margin:6px 4px 6px 10px;padding:8px 10px;border:1px solid var(--ink);border-radius:8px;background:var(--paper);font-size:14px}
.cue .d.renamed{font-weight:700}
.removed{display:flex;flex-direction:column;gap:8px}
.removed-list{display:flex;flex-wrap:wrap;gap:8px}
.removed-list button{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px dashed var(--mute);border-radius:10px;background:var(--paper);font-size:13px;cursor:pointer}
.removed-list b{font-size:16px}
.cue .grip{width:52px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:22px;cursor:grab;touch-action:none}
.cue li.dragging{position:relative;z-index:1;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cue li.dragging .grip{cursor:grabbing}
/* server save state: green = saved and checked, amber = changes not saved yet, red = save failed / server unreachable */
.save-state{margin:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mute)}
.save-state[data-s="ok"] .sdot{background:#1F9D55}
.save-state[data-s="dirty"] .sdot{background:#D69E2E}
.save-state[data-s="err"] .sdot{background:#C53030}
.save-state[data-s="err"]{color:#C53030}

/* personal numbers in use + reset between shows */
.seats{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.seats-count{margin:2px 0 0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}

/* mode 7: tap a number to switch its button sound on / off (following the stage monitor) */
.step7{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--ink);border-radius:14px}
.step7-nums{display:flex;flex-wrap:wrap;gap:8px}
.step7-nums button{min-width:60px;padding:14px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute);cursor:pointer}
.step7-nums button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.step7-nums button:disabled{cursor:default;opacity:.6}

/* confirm bar for jumping straight to a mode */
.confirm{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--paper);border-top:1px solid var(--ink);
}
.confirm-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.confirm p{margin:0;flex:1;min-width:0;font-weight:700}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--ink);background:var(--paper);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>TX</h1>
    <div class="status" id="status" role="status"><span class="dot"></span><span id="status-text">연결 중</span></div>
  </header>

  <main id="console">
    <div style="display:flex;flex-direction:column;gap:20px">
      <section class="now" aria-label="현재 모드">
        <span class="now-label">지금 송출 중</span>
        <div class="now-row">
          <span class="now-mode" id="now-mode">–</span>
        </div>
        <p class="now-desc" id="now-desc"></p>
      </section>

      <button class="next" id="next" type="button">다음 모드</button>
      <p class="err" id="err"></p>

      <section class="step7" id="step7" aria-label="모드 H 소리 열기" hidden>
        <h2 class="list-title">모드 H · 번호를 누르면 그 번호 버튼 소리 ON / 다시 누르면 OFF</h2>
        <div class="step7-nums" id="step7-nums"></div>
      </section>

      <section class="seats" aria-label="번호 선택 모드">
        <div>
          <h2 class="list-title">관객 번호 배정</h2>
          <p class="seats-count" id="pick-state">–</p>
        </div>
        <button class="btn" id="pick-toggle" type="button" aria-pressed="false">번호 선택 모드</button>
      </section>

      <section class="mode-lists" aria-labelledby="modes-title">
        <div class="panel-head">
          <h2 class="list-title" id="modes-title">모드 · RUN을 켜고 누르면 바로 실행</h2>
          <div class="view-ctrls">
          <button type="button" class="run" id="run-toggle" aria-pressed="false" title="켜져 있는 동안 모드를 누르면 바로 전환">RUN</button>
          <div class="tabs" role="tablist" aria-label="모드 보기">
            <button type="button" role="tab" id="tab-cue" aria-controls="view-cue" aria-selected="true">순서</button>
            <button type="button" role="tab" id="tab-abc" aria-controls="view-abc" aria-selected="false">A~S</button>
          </div>
          </div>
        </div>

        <!-- 순서: the saved cue order ("다음 모드" follows it); ≡ drags a row, then 순서 저장 -->
        <div class="view" id="view-cue" role="tabpanel" aria-labelledby="tab-cue">
          <div class="panel-head">
            <p class="save-state" id="cue-state" data-s="wait" role="status"><span class="sdot"></span><span id="cue-state-text">서버 확인 중…</span></p>
            <div class="order-btns">
              <button class="btn" id="order-revert" type="button" disabled>되돌리기</button>
              <button class="btn primary" id="order-save" type="button" disabled>순서 저장</button>
            </div>
          </div>
          <ol class="modes cue" id="cue" aria-label="모드 순서 (≡를 끌어서 바꿈, ✕로 삭제)"></ol>
          <div class="removed" id="removed" hidden>
            <h3 class="list-title">삭제한 모드 · 누르면 순서 맨 끝에 다시 들어가요</h3>
            <div class="removed-list" id="removed-list"></div>
          </div>
        </div>

        <!-- A~O: every mode in letter order -->
        <div class="view" id="view-abc" role="tabpanel" aria-labelledby="tab-abc" hidden>
          <ul class="modes" id="modes" aria-label="모드 A~S"></ul>
        </div>
      </section>

      <section class="seats" aria-label="관객 번호">
        <div>
          <h2 class="list-title">관객 번호</h2>
          <p class="seats-count" id="seats-count">–</p>
        </div>
        <button class="btn" id="reset-claims" type="button">번호 전체 초기화</button>
      </section>
    </div>
  </main>
</div>

<div class="confirm" id="confirm" hidden>
  <div class="confirm-in">
    <p id="confirm-text"></p>
    <button class="btn" id="confirm-no" type="button">취소</button>
    <button class="btn primary" id="confirm-yes" type="button">전환</button>
  </div>
</div>

<script>
(() => {
  // DEVICE table: what each mode does on the audience phones
  const MODES = [
    { n: 0, d: "버퍼 로고" },
    { n: 1, d: "개인번호 (웹 02~90 짝수)" },
    { n: 2, d: "공연 안내 멘트" },
    { n: 3, d: "개인번호" },
    { n: 4, d: "개인번호+인물 발화 1" },
    { n: 5, d: "개인번호+인물 발화 2" },
    { n: 6, d: "디바이스 모든 기능 MUTE" },
    { n: 7, d: "17/32/11/10/31번/전체 버튼 ON" },
    { n: 8, d: "버튼 띵동" },
    { n: 9, d: "도형(○ △ □ ☆ ✕)+음계" },
    { n: 10, d: "도형(○ △ □ ☆ ✕)+멜로디" },
    { n: 11, d: "개인번호+도형+음계 길게 꾹 15초" },
    { n: 12, d: "도형+도레미파솔" },
    { n: 13, d: "내장 LED 0.2초 간격으로 5번 깜빡" },
    { n: 14, d: "개인번호+도형(○ △ □ ☆ ✕)+음계 → 터디" },
    { n: 15, d: "음계만 (음 이름 + 누르면 단음)" },
    { n: 16, d: "도형+음계 (번호 없이, 누르면 단음)" },
    { n: 17, d: "도형+도레미파솔 (번호 없이)" },
    { n: 18, d: "도레미파솔 (도~솔 이름만)" },
  ];
  // modes are shown as letters A~O (0 = A … 14 = O); the server, boards and TouchDesigner keep the numbers 0~14
  const L = (n) => String.fromCharCode(65 + n);
  const $ = (id) => document.getElementById(id);
  let state = null, offset = 0, pending = null, busy = false;

  const setStatus = (ok, text) => {
    $("status").className = "status " + (ok ? "ok" : "bad");
    $("status-text").textContent = text;
  };

  async function call(method, body) {
    const t0 = Date.now();
    const r = await fetch("/api/state", {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store",
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.message || "요청 실패 (" + r.status + ")"), { status: r.status });
    offset = j.nowMs - (t0 + Date.now()) / 2; // server clock minus ours
    return j;
  }

  // left: every mode A~O, always in letter order (tap = run it)
  const list = $("modes");
  const byN = (n) => MODES.find((x) => x.n === n);
  for (const m of MODES) {
    const li = document.createElement("li");
    li.innerHTML = `<button type="button" class="mode" data-n="${m.n}"><span class="n">${L(m.n)}</span><span class="d">${m.d}</span></button>`;
    list.appendChild(li);
  }

  // right: the cue order. The server only stores this chart; "다음 모드" runs the next letter in it.
  // order = what the server holds (last confirmed), the list on screen may differ until "순서 저장".
  const cue = $("cue");
  let order = MODES.map((m) => m.n); // A, B, C … until the server's chart arrives
  let labels = order.map(() => null);  // a name per row, renamed on this page (null = the mode's own description)
  let serverKnown = false, saving = false, editing = false;
  const draft = () => [...cue.children].map((li) => +li.dataset.n);
  const draftLabels = () => [...cue.children].map((li) => li.dataset.label || null);
  const same = (o1, l1, o2, l2) => JSON.stringify([o1, l1]) === JSON.stringify([o2, l2]);
  const dirty = () => !same(draft(), draftLabels(), order, labels);
  const hhmmss = () => { const d = new Date(), p = (v) => String(v).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
  function setSaveState(s, text) {
    $("cue-state").dataset.s = s;
    $("cue-state-text").textContent = text;
  }
  function refreshSaveUi(okText) {
    const d = dirty();
    $("order-save").disabled = !d || saving;
    $("order-revert").disabled = !d || saving;
    renderRemoved();
    if (saving) setSaveState("wait", "서버에 저장 중…");
    else if (d) setSaveState("dirty", "저장 안 됨 · 바꾼 순서가 아직 서버에 없어요");
    else if (okText) setSaveState("ok", okText);
  }
  function cueRow(m, label) {
    const li = document.createElement("li");
    li.dataset.n = m.n;
    li.dataset.label = label || "";
    li.innerHTML = `<button type="button" class="mode" data-n="${m.n}"><span class="pos"></span><span class="n">${L(m.n)}</span><span class="d">${m.d}</span><span class="now-tag" hidden>지금</span></button><button type="button" class="dup" aria-label="${L(m.n)} 복제" title="바로 아래에 복제">⧉</button><button type="button" class="del" aria-label="${L(m.n)} 순서에서 삭제" title="순서에서 삭제">✕</button><span class="grip" aria-hidden="true">≡</span>`;
    showLabel(li);
    return li;
  }
  function showLabel(li) {
    const d = li.querySelector(".d");
    d.textContent = li.dataset.label || byN(+li.dataset.n).d;
    d.classList.toggle("renamed", !!li.dataset.label);
    d.title = "더블클릭해서 이름 바꾸기 (RUN 꺼져 있을 때)";
  }
  function renderCue(seq, labs) {
    cue.innerHTML = "";
    seq.forEach((n, i) => { const m = byN(n); if (m) cue.appendChild(cueRow(m, labs && labs[i])); });
    renumber();
    render();
  }
  // modes not in the list on screen: shown under it so they can be put back
  function renderRemoved() {
    const inList = new Set(draft());
    const gone = MODES.filter((m) => !inList.has(m.n));
    $("removed").hidden = !gone.length;
    $("removed-list").innerHTML = gone.map((m) => `<button type="button" data-n="${m.n}" aria-label="${L(m.n)} 다시 넣기"><b>${L(m.n)}</b>${m.d} ＋</button>`).join("");
    for (const b of cue.querySelectorAll(".del")) b.disabled = saving || cue.children.length <= 1; // keep at least one
  }
  const renumber = () => { [...cue.children].forEach((li, i) => { li.querySelector(".pos").textContent = i + 1; }); renderRemoved(); };
  // ✕ takes a row out of the order, ⧉ puts a copy of that mode right under it (the same mode can run more
  // than once), a removed mode goes back at the end; all need 순서 저장 like a drag
  cue.addEventListener("click", (e) => {
    const b = e.target.closest(".del, .dup");
    if (!b || b.disabled || saving) return;
    const li = b.closest("li");
    if (b.classList.contains("dup")) li.after(cueRow(byN(+li.dataset.n), li.dataset.label));
    else li.remove();
    renumber(); render(); refreshSaveUi(`서버에 저장됨 · ${hhmmss()} 확인`);
  });
  $("removed-list").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || saving) return;
    cue.appendChild(cueRow(byN(+b.dataset.n)));
    renumber(); render(); refreshSaveUi(`서버에 저장됨 · ${hhmmss()} 확인`);
  });
  async function loadOrder() {
    if (saving || drag || editing) return;
    try {
      const r = await fetch("/api/modeorder", { cache: "no-store" });
      const j = await r.json();
      if (!r.ok || !Array.isArray(j.order)) throw new Error();
      const jl = Array.isArray(j.labels) ? j.labels : j.order.map(() => null);
      const changed = !same(j.order, jl, order, labels);
      const wasDirty = serverKnown && dirty();
      order = j.order; labels = jl;
      serverKnown = true;
      if (!wasDirty && (changed || !cue.children.length)) renderCue(order, labels); // never overwrite unsaved changes
      refreshSaveUi(`서버에 저장됨 · ${hhmmss()} 확인`);
    } catch (_) {
      setSaveState("err", "서버 연결 안 됨 · 저장 상태를 확인할 수 없어요");
    }
  }
  $("order-revert").addEventListener("click", () => { renderCue(order, labels); refreshSaveUi(`서버에 저장됨 · ${hhmmss()} 확인`); });
  $("order-save").addEventListener("click", () => saveCue());
  async function saveCue() {
    const want = draft(), wantL = draftLabels();
    if (!want.length || saving) return;
    saving = true; refreshSaveUi();
    try {
      const r = await fetch("/api/modeorder", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ order: want, labels: wantL }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || "서버 응답 " + r.status);
      // read it back so "저장됨" means the server really holds this order (and these names)
      const back = await (await fetch("/api/modeorder", { cache: "no-store" })).json();
      if (!Array.isArray(back.order) || !same(back.order, back.labels, want, wantL)) throw new Error("서버에 다른 순서가 남아 있어요");
      order = back.order; labels = back.labels;
      saving = false;
      render();
      refreshSaveUi(`서버에 저장됨 · ${hhmmss()} 저장 완료`);
    } catch (e) {
      saving = false;
      refreshSaveUi();
      setSaveState("err", "저장 실패 · " + (e.message || "서버에 연결할 수 없어요"));
    }
  }

  // rename a row: double-click (or double-tap) its name while RUN is off. Enter / leaving the box saves it to the
  // server straight away (with the rest of the list as it is on screen); Esc cancels; an empty name goes back to
  // the mode's own description.
  let lastTap = { li: null, t: 0 };
  cue.addEventListener("click", (e) => {
    const d = e.target.closest(".d");
    if (!d || runOn || saving || editing) return;
    const li = d.closest("li"), now = Date.now();
    if (lastTap.li === li && now - lastTap.t < 450) { lastTap = { li: null, t: 0 }; startRename(li); }
    else lastTap = { li, t: now };
  });
  function startRename(li) {
    editing = true;
    const btn = li.querySelector(".mode"), m = byN(+li.dataset.n);
    const box = document.createElement("input");
    box.className = "rename"; box.maxLength = 40; box.value = li.dataset.label || m.d;
    box.setAttribute("aria-label", `${L(m.n)} 이름`);
    btn.hidden = true;
    btn.after(box);
    box.focus(); box.select();
    let done = false;
    const finish = (keep) => {
      if (done) return; done = true;
      const v = box.value.trim();
      if (keep) li.dataset.label = v && v !== m.d ? v : "";
      box.remove(); btn.hidden = false; editing = false;
      showLabel(li); render();
      if (keep && dirty()) saveCue(); else refreshSaveUi(`서버에 저장됨 · ${hhmmss()} 확인`);
    };
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    box.addEventListener("blur", () => finish(true));
  }
  // drag by the grip (touch or mouse); tapping the rest of the row runs that mode, like the A~O list
  let drag = null;
  cue.addEventListener("pointerdown", (e) => {
    const li = e.target.closest(".grip") && e.target.closest("li");
    if (!li || saving) return;
    e.preventDefault();
    drag = { li, id: e.pointerId };
    li.setPointerCapture(e.pointerId);
    li.classList.add("dragging");
  });
  cue.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const rows = [...cue.children].filter((x) => x !== drag.li);
    const before = rows.find((x) => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; }) || null;
    if (drag.li.nextElementSibling !== before) { cue.insertBefore(drag.li, before); renumber(); }
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.li.classList.remove("dragging");
    drag = null;
    refreshSaveUi(`서버에 저장됨 · ${hhmmss()} 확인`);
  };
  cue.addEventListener("pointerup", endDrag);
  cue.addEventListener("pointercancel", endDrag);

  // two views of the same modes: 순서 (cue order) / A~O; the choice is remembered on this screen
  function showTab(which) {
    const cueOn = which !== "abc";
    $("tab-cue").setAttribute("aria-selected", String(cueOn));
    $("tab-abc").setAttribute("aria-selected", String(!cueOn));
    $("view-cue").hidden = !cueOn;
    $("view-abc").hidden = cueOn;
    try { localStorage.setItem("tx-mode-view", cueOn ? "cue" : "abc"); } catch (_) {}
  }
  $("tab-cue").addEventListener("click", () => showTab("cue"));
  $("tab-abc").addEventListener("click", () => showTab("abc"));
  try { showTab(localStorage.getItem("tx-mode-view") || "cue"); } catch (_) { showTab("cue"); }

  // where the show is in the saved cue order. A mode can appear more than once, so the row is tracked here
  // (and remembered on this screen); if the mode was changed elsewhere, the next row holding it is used.
  let cuePos = -1;
  try { cuePos = +(localStorage.getItem("tx-cue-pos") ?? -1); } catch (_) {}
  function syncPos() {
    if (busy) return; // a switch is on its way: keep the row it was sent from until the server answers
    if (order[cuePos] !== state.mode) {
      const ahead = order.indexOf(state.mode, Math.max(0, cuePos));
      cuePos = ahead >= 0 ? ahead : order.indexOf(state.mode);
    }
    try { localStorage.setItem("tx-cue-pos", String(cuePos)); } catch (_) {}
  }
  // the row after the current one in the saved cue order (null at the end)
  const nextInOrder = () => {
    syncPos();
    const i = cuePos < 0 ? 0 : cuePos + 1; // the current mode was deleted from the order: start from the top
    return i < order.length ? { ...byN(order[i]), i } : null;
  };
  renderCue(order);

  function render() {
    if (!state) return;
    const m = byN(state.mode) || { d: "" };
    $("now-mode").textContent = "MODE " + L(state.mode);
    $("now-desc").textContent = m.d;
    const next = nextInOrder();
    for (const b of list.querySelectorAll(".mode")) b.setAttribute("aria-current", String(+b.dataset.n === state.mode));
    // in the cue list only the current row is marked (a duplicated mode has other rows); while the list has
    // unsaved changes the rows no longer match the saved order, so the first row with the mode is marked
    const rows = [...cue.children];
    const cur = !dirty() && cuePos >= 0 ? cuePos : rows.findIndex((li) => +li.dataset.n === state.mode);
    rows.forEach((li, i) => { li.querySelector(".mode").setAttribute("aria-current", String(i === cur)); li.querySelector(".now-tag").hidden = i !== cur; });
    if (cur >= 0 && rows[cur].dataset.label) $("now-desc").textContent = rows[cur].dataset.label;
    $("next").disabled = !next || busy;
    $("next").textContent = next ? `다음 모드 → ${L(next.n)}` : "마지막 모드입니다";
    renderStep7();
  }

  // mode 7: each number (and "전체" = everyone) is switched on / off on its own; stored as bits 0~5
  const STEP7 = [17, 32, 11, 31, 10];
  const LABELS7 = [...STEP7.map((n) => String(n).padStart(2, "0")), "전체"];
  $("step7-nums").innerHTML = LABELS7.map((t, i) => `<button type="button" data-bit="${i}" aria-pressed="false">${t}</button>`).join("");
  function renderStep7() {
    const on = state.mode === 7;
    $("step7").hidden = !on;
    if (!on) return;
    const mask = typeof state.open7 === "number" ? state.open7 : 0;
    for (const b of $("step7-nums").children) {
      b.setAttribute("aria-pressed", String(!!(mask & (1 << +b.dataset.bit))));
      b.disabled = busy;
    }
  }
  async function setOpen7(mask) {
    busy = true; render();
    $("err").textContent = "";
    try {
      const r = await fetch("/api/mode7", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mask }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || "번호 전환 실패 (" + r.status + ")");
      state = j;
    } catch (e) { $("err").textContent = e.message; }
    finally { busy = false; render(); }
  }
  $("step7-nums").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || !state || busy) return;
    setOpen7((state.open7 || 0) ^ (1 << +b.dataset.bit)); // flip just this one
  });

  async function setMode(n, prevPos) {
    busy = true; render();
    $("err").textContent = "";
    try {
      state = await call("POST", { mode: n });
      setStatus(true, "연결됨");
    } catch (e) {
      $("err").textContent = e.message;
      if (prevPos !== undefined) cuePos = prevPos; // didn't switch: the cue stays where it was
    } finally {
      busy = false; render();
    }
  }

  async function refresh() {
    try {
      state = await call("GET");
      setStatus(true, "연결됨");
      render();
    } catch (e) {
      setStatus(false, "연결 끊김 · 다시 시도 중");
    }
  }

  $("next").addEventListener("click", () => { const n = state && nextInOrder(); if (n) { const prev = cuePos; cuePos = n.i; setMode(n.n, prev); } }); // follows the cue order

  // RUN: off = tapping a row does nothing (safe to look around / drag); on = a tap switches the show at once.
  // Always starts off when the page opens.
  let runOn = false;
  $("run-toggle").addEventListener("click", () => {
    runOn = !runOn;
    $("run-toggle").setAttribute("aria-pressed", String(runOn));
    document.querySelector(".mode-lists").classList.toggle("armed", runOn);
  });
  const runTap = (e) => { // a tap on a row in either view
    const b = e.target.closest(".mode");
    if (!runOn || !b || !state || busy) return;
    const li = cue.contains(b) ? b.closest("li") : null, prev = cuePos;
    if (li && !dirty()) cuePos = [...cue.children].indexOf(li); // the cue continues from the row that was tapped
    if (+b.dataset.n === state.mode) { render(); return; } // same mode (e.g. its copy further down): just move the marker
    setMode(+b.dataset.n, prev);
  };
  list.addEventListener("click", runTap);
  cue.addEventListener("click", runTap);
  $("confirm-no").addEventListener("click", () => { pending = null; $("confirm").hidden = true; });
  $("confirm-yes").addEventListener("click", () => {
    const n = pending; pending = null; $("confirm").hidden = true;
    if (n === "reset") resetClaims();
    else if (n === "pick-on" || n === "pick-off") setPick(n === "pick-on");
    else if (typeof n === "number") setMode(n); // mode 0 (logo) included
  });

  // audience numbers: how many of 1~40 are taken, and a reset for the next show
  async function refreshClaims() {
    try {
      const j = await (await fetch("/api/claims", { cache: "no-store" })).json();
      $("seats-count").textContent = `${j.taken.length} / 45 선택됨`;
      if (typeof j.pickMode === "boolean") renderPick(j.pickMode);
    } catch (_) {}
  }

  // 번호 선택 모드: ON = 관객이 /rx 오른쪽 위에서 번호를 직접 고름, OFF = 들어온 순서대로 자동 배정
  let pickMode = null;
  function renderPick(on) {
    pickMode = on;
    $("pick-state").textContent = on ? "직접 선택" : "선착순 자동";
    $("pick-toggle").textContent = on ? "번호 선택 모드 끄기" : "번호 선택 모드";
    $("pick-toggle").setAttribute("aria-pressed", String(on));
    $("pick-toggle").classList.toggle("primary", on);
  }
  async function setPick(on) {
    $("err").textContent = "";
    try {
      const r = await fetch("/api/pickmode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || "번호 선택 모드 전환 실패 (" + r.status + ")");
      renderPick(j.pickMode);
    } catch (e) { $("err").textContent = e.message; }
  }
  $("pick-toggle").addEventListener("click", () => {
    if (pickMode === null) return;
    pending = pickMode ? "pick-off" : "pick-on";
    $("confirm-text").textContent = pickMode
      ? "번호 선택 모드를 끌까요? 다시 선착순으로 배정돼요."
      : "관리자 확인용 옵션입니다. 번호를 선택할 수 있는 모드로 전환할까요?";
    $("confirm").hidden = false;
    $("confirm-yes").focus();
  });
  async function resetClaims() {
    $("err").textContent = "";
    try {
      const r = await fetch("/api/claims/reset", { method: "POST" });
      if (!r.ok) throw new Error("초기화 실패 (" + r.status + ")");
      refreshClaims();
    } catch (e) { $("err").textContent = e.message; }
  }
  $("reset-claims").addEventListener("click", () => {
    pending = "reset";
    $("confirm-text").textContent = "관객 번호를 모두 풀까요? 다들 다시 골라야 해요.";
    $("confirm").hidden = false;
    $("confirm-yes").focus();
  });

  setInterval(() => { refresh(); refreshClaims(); loadOrder(); }, 3000); // stay in sync if another operator changes the mode or order
  refresh();
  refreshClaims();
  loadOrder();
})();
</script>
</body>
</html>
