<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0F10">
<title>RX</title>
<style>
/* nothing on this page can be selected, long-press copied or dragged (phones and desktop) */
*,*::before,*::after{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* no double-tap zoom (taps still register at once) */
html,body{touch-action:manipulation}
img,svg,image{-webkit-user-drag:none;user-drag:none}
:root{
  --paper:#fff;
  --pp:rgba(246,247,245,.24);
  --pp-edge:rgba(150,156,154,.45);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);display:grid;place-items:center;overflow:hidden}

.stage{
  --w:min(520px,80vw,calc((100svh - 60px) / 2.3));
  --h:calc(var(--w) * 900 / 696);
  --pad:calc(var(--w) * .03);
  --bw:calc(var(--w) + var(--pad) * 2);
  --bh:calc(var(--h) + var(--pad) * 2);
  --mm:calc(var(--w) / 41.9);
  --bd:calc(var(--mm) * 18);
  --stand:calc(var(--mm) * 11.2);
  --t:calc(var(--w) * .014);
  position:relative;
  width:var(--bw);height:calc(var(--bh) + var(--mm) * 40); /* room above for the button cap and the click text */
  perspective:5000px;
  perspective-origin:50% calc(50% + var(--mm) * 7); /* follow .rot so the case front face stays aligned */
}
.rot,.box,.board{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.rot{left:50%;top:calc(50% + var(--mm) * 7)}

.face{
  position:absolute;
  background:var(--grain),linear-gradient(160deg,rgba(255,255,255,.1),rgba(235,238,236,.04) 60%,rgba(255,255,255,.12)),var(--pp);
  border:1px solid var(--pp-edge);
  box-shadow:inset 0 0 calc(var(--w) * .05) rgba(255,255,255,.55);
}
.f-front,.f-back{border-radius:calc(var(--w) * .035)}

.lid{
  position:absolute;top:0;bottom:0;right:calc(var(--pad) * .55);width:0;
  border-left:1px solid rgba(120,126,124,.4);border-right:1px solid rgba(255,255,255,.7);
}
.latch{
  position:absolute;top:50%;right:calc(var(--bw) * -.04);
  width:calc(var(--bw) * .04);height:calc(var(--bh) * .13);margin-top:calc(var(--bh) * -.065);
  background:var(--grain),var(--pp);border:1px solid var(--pp-edge);border-left:0;
  border-radius:0 calc(var(--w) * .012) calc(var(--w) * .012) 0;
}
.shadow{
  position:absolute;left:50%;top:calc(50% + var(--mm) * 7);pointer-events:none;
  width:calc(var(--bw) * .96);height:calc(var(--bh) * .96);
  margin:calc(var(--bh) * -.48 + var(--w) * .035) 0 0 calc(var(--bw) * -.48);
  border-radius:calc(var(--w) * .04);
  box-shadow:0 calc(var(--w) * .03) calc(var(--w) * .09) rgba(40,46,44,.28);
}
.f-front,.f-back{width:var(--bw);height:var(--bh);margin:calc(var(--bh) / -2) 0 0 calc(var(--bw) / -2)}
.f-front{transform:translateZ(calc(var(--bd) / 2))}
.f-back{transform:rotateY(180deg) translateZ(calc(var(--bd) / 2))}
.f-left,.f-right{width:var(--bd);height:var(--bh);margin:calc(var(--bh) / -2) 0 0 calc(var(--bd) / -2)}
.f-right{transform:rotateY(90deg) translateZ(calc(var(--bw) / 2))}
/* light from inside the case: a glow pooled around each LED, just behind the frosted front face.
   Its opacity follows the LED level (--lit, set from the LED script), so it brightens and fades with the LEDs */
.ov.case-glow{transform:translateZ(calc(var(--bd) / 2 - var(--w) * .003));opacity:var(--lit,0);transition:opacity .2s ease-out;pointer-events:none}
.f-left{transform:rotateY(-90deg) translateZ(calc(var(--bw) / 2))}
.f-top,.f-bottom{width:var(--bw);height:var(--bd);margin:calc(var(--bd) / -2) 0 0 calc(var(--bw) / -2)}
.f-top{transform:rotateX(90deg) translateZ(calc(var(--bh) / 2))}
.f-bottom{transform:rotateX(-90deg) translateZ(calc(var(--bh) / 2))}
/* side faces get the same corner radius, so the case corners read as rounded when the box is turned */

.board{transform:translateZ(calc(var(--bd) / -2 + var(--stand)))}
.pcb{
  position:absolute;width:var(--w);height:var(--h);
  margin:calc(var(--h) / -2) 0 0 calc(var(--w) / -2);
  clip-path:polygon(0 0,85.9% 0,85.9% 58%,100% 58%,100% 100%,0 100%);
}
.pcb.top{background:url(/assets/rx/board.png) center/100% 100% no-repeat;filter:brightness(.62) saturate(.8)} /* board photo darkened; the LED glow layer sits above it */
.pcb.core{background:#0e2613}
.pcb.back{background:#0b1f10}

/* 0.96" 128x64 OLED module: glass + FPC laid flat toward the board-edge connector */
.ov{
  position:absolute;width:var(--w);height:var(--h);
  margin:calc(var(--h) / -2) 0 0 calc(var(--w) / -2);
  pointer-events:none;
}
.ov svg{display:block;width:100%;height:100%;overflow:visible}
.ov.fpc{transform:translateZ(calc(var(--w) * .008))}
.ov.chip{transform:translateZ(calc(var(--w) * .006))} /* QFN body: just above the board, under the cable */
.ov.bolts{transform:translateZ(calc(var(--bd) / 2 + var(--w) * .004))} /* screw heads on the outside of the case front (.f-front at bd/2) */
.ov.g0{transform:translateZ(calc(var(--w) * .012))}
.ov.g1{transform:translateZ(calc(var(--w) * .017))}
.ov.g2{transform:translateZ(calc(var(--w) * .022))}
.ov.g3{transform:translateZ(calc(var(--w) * .027))}
.ov.glass{transform:translateZ(calc(var(--w) * .032))}
.ov.oled-top{transform:translateZ(calc(var(--bd) / 2 + var(--w) * .004))} /* just in front of the lid (.f-front at bd/2) */
/* push button: one pre-drawn SVG layer just behind the board (cheap on phones); only the cap+plunger move */
.ov.btn2{transform:translateZ(calc(var(--t) * -1 - var(--mm) * .2))}
/* button darkened to match the device (same as the board): the chrome cap and nut read dark, the lit LEDs/OLED stand out */
.ov.btn2 #btn-svg{filter:brightness(.75) saturate(.8)}
.ov.btn2 #press{pointer-events:auto;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .16s cubic-bezier(.3,1.25,.5,1)}
.ov.btn2 #press.down{transform:translateY(20px);transition:transform .08s ease-in} /* 1.2 mm of travel */

/* number from the picker, lit on the OLED's active area (x 16..222, y 26..400), centred.
   Slight blur + softened glow: it is seen through the frosted case lid */
.oled-num{
  position:absolute;left:calc(16 / 696 * 100%);top:calc(26 / 900 * 100%);
  width:calc(206 / 696 * 100%);height:calc(374 / 900 * 100%);
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  font:400 calc(var(--w) * .228)/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 calc(var(--w) * .006) rgba(255,255,255,.95),0 0 calc(var(--w) * .024) rgba(225,238,255,.55);
  filter:blur(.3px) brightness(1.9);opacity:1; /* lit OLED: boosted well past white to counter the dimming lid; sharp */
}
.oled-line{display:flex;flex-direction:column;align-items:center;white-space:nowrap;font-size:.72em} /* chapter 3 stack: sized so "C#4" fits the panel width */
.oled-fit{display:inline-block;line-height:1;white-space:nowrap} /* size and centring set by fitText() */
.oled-n,.oled-note{line-height:1}
.oled-note{letter-spacing:-.02em} /* note name, same height as the number */
/* gap to the number is set in script from each glyph's measured ink, so ● △ □ sit the same distance below it */
.oled-shape{font-size:.8em;line-height:1;letter-spacing:0}
.oled-shape-only{display:inline-block;line-height:1;letter-spacing:0;white-space:nowrap} /* mode 9: size and centring set by fitShape() */
/* mode 0: the BUFFER 버퍼 logo with its dots, cropped to its ink (viewBox) and as wide as the panel */
.ov .oled-logo{display:block;width:100%;height:100%;overflow:hidden;filter:drop-shadow(0 0 calc(var(--w) * .006) rgba(255,255,255,.95))}
.oled-shape.tri{} /* the △ glyph draws much larger than ● and □; shrink it to match */ /* under the number, both centred */
/* text shown above the case, centred, when the button is clicked */
@font-face{font-family:"SUIT Variable";font-weight:100 900;font-style:normal;font-display:swap;src:url(/fonts/SUIT-Variable.woff2) format("woff2-variations")}
.oled-msg{
  position:absolute;left:0;right:0;top:calc(var(--mm) * 2);z-index:5;
  text-align:center;
  font:400 20px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.03em; /* tracking -30 */
  word-spacing:normal;
  color:#0A0B0C;
  opacity:0;pointer-events:none;
}
/* iOS look: same grey rounded pill as the number picker */
.oled-msg-pill{display:inline-block;padding:8px 16px;border-radius:10px;background:rgba(118,118,128,.12)}
/* number picker 1-40, top-right (independent of the board): a trigger that drops down an iOS-style wheel */
.picker{
  position:fixed;z-index:10;
  top:calc(16px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.03em;color:#0A0B0C;
}
/* iOS compact picker look: grey rounded pill, value turns blue while the wheel is open */
.picker-trigger{
  display:flex;align-items:center;justify-content:center;min-width:52px;
  padding:7px 12px;border:0;border-radius:8px;background:rgba(118,118,128,.12);color:inherit;cursor:default;
  font:400 17px/1.2 "Helvetica Neue",Helvetica,Arial,sans-serif;
  letter-spacing:normal;font-variant-numeric:tabular-nums;
  transition:color .15s ease,background-color .15s ease;
}
.picker-trigger:active{background:rgba(118,118,128,.2)}
.picker.open .picker-trigger{color:#007AFF}
.picker-trigger:focus-visible,.picker-done:focus-visible,.picker-wheel:focus-visible{outline:2px solid #0A0B0C;outline-offset:2px}
.picker-panel{
  position:absolute;top:calc(100% + 6px);right:0;width:168px;
  background:#fff;border:1px solid #D9DCDE;border-radius:14px;box-shadow:0 12px 32px rgba(10,11,12,.16);
  overflow:hidden;transform-origin:top right;
  opacity:0;transform:translateY(-6px) scaleY(.4);visibility:hidden;
  transition:opacity .18s ease,transform .26s cubic-bezier(.2,.9,.3,1),visibility 0s .26s;
}
.picker.open .picker-panel{opacity:1;transform:none;visibility:visible;transition:opacity .18s ease,transform .26s cubic-bezier(.2,.9,.3,1)}
.picker-view{position:relative;height:180px}
.picker-band{position:absolute;left:8px;right:8px;top:72px;height:36px;border-radius:8px;background:#EEF0F0;pointer-events:none}
.picker-wheel{
  position:relative;height:180px;margin:0;padding:72px 0;list-style:none;box-sizing:border-box;
  overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;
  perspective:400px;
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);
  mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);
}
.picker-wheel::-webkit-scrollbar{display:none}
.picker-wheel li{
  height:36px;line-height:36px;text-align:center;scroll-snap-align:center;cursor:pointer;
  font-size:20px;font-variant-numeric:tabular-nums;color:#0A0B0C;transform-origin:center;
}
.picker-done{
  display:block;width:100%;padding:11px 0;border:0;border-top:1px solid #E4E6E8;background:#fff;cursor:pointer;
  font:400 15px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.03em;color:#0A0B0C;
}
.picker-wheel li.taken{color:#C2C6CA;text-decoration:line-through;text-decoration-thickness:1px} /* held by another phone */
.picker-done:disabled{color:#A3A8AD;cursor:default}
@media (prefers-reduced-motion:reduce){.picker-panel,.picker-trigger{transition:none}}
/* pop on, hold, pop off: no fades. When the animation ends the pill drops straight back to opacity 0 */
.oled-msg.show{animation:oled-msg 1s linear}
@keyframes oled-msg{
  0%,100%{opacity:1}
}
.ov.ant-b{transform:translateZ(calc(var(--w) * .03))}
.ov.ant-f{transform:translateZ(calc(var(--w) * .062))}
.ov.ant-s{transform:translateZ(calc(var(--w) * .004))}
.ov.leds{transform:translateZ(calc(var(--w) * .005))}
#leds{opacity:0} /* opacity, glow size and fade set from the LED interval script */
#leds .glow{transform-box:fill-box;transform-origin:center;transform:scale(var(--glow,1));transition:inherit}
.ov .edge{
  position:absolute;left:calc(10 / 696 * 100%);top:calc(20 / 900 * 100%);
  width:calc(260 / 696 * 100%);height:calc(385 / 900 * 100%);
  background:rgba(60,62,64,.35);border:1px solid rgba(150,154,156,.4);border-radius:calc(var(--w) * .004);
}

/* dark mode (rx only): dark page, smoky case, iOS-dark picker */
/* device darkened so the LEDs (and the lit OLED) stand out: a near-black case, edges just visible */
:root{--paper:#0E0F10;--pp:rgba(18,20,21,.6);--pp-edge:rgba(72,78,80,.45);color-scheme:dark}
.face{
  background:var(--grain),linear-gradient(160deg,rgba(255,255,255,.06),rgba(235,238,236,.02) 60%,rgba(255,255,255,.07)),var(--pp);
  box-shadow:inset 0 0 calc(var(--w) * .05) rgba(255,255,255,.12);
}
.lid{border-left-color:rgba(0,0,0,.5);border-right-color:rgba(255,255,255,.18)}
.shadow{box-shadow:0 calc(var(--w) * .03) calc(var(--w) * .09) rgba(0,0,0,.7)}
.oled-msg,.picker,.picker-wheel li,.picker-done{color:#F2F2F7}
.oled-msg-pill,.picker-trigger{background:rgba(118,118,128,.24)}
.picker-trigger:active{background:rgba(118,118,128,.36)}
.picker.open .picker-trigger{color:#0A84FF}
.picker-trigger:focus-visible,.picker-done:focus-visible,.picker-wheel:focus-visible{outline-color:#F2F2F7}
.picker-panel{background:#1C1C1E;border-color:#38383A;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.picker-band{background:#2C2C2E}
.picker-done{background:#1C1C1E;border-top-color:#38383A}
.picker-wheel li.taken{color:#55575C}
.picker-done:disabled{color:#636366}
</style>
</head>
<body>
  <script>
    // no text selection, long-press menu or dragging anywhere on the page (backs up the CSS on older phones)
    for (const ev of ["selectstart", "contextmenu", "dragstart"]) document.addEventListener(ev, (e) => e.preventDefault(), { capture: true });
    // no zooming: iPhone Safari ignores user-scalable=no, so block its pinch gesture and a quick second tap too
    for (const ev of ["gesturestart", "gesturechange"]) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
    document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  </script>
  <div class="stage" role="img" aria-label="LaNA RX 보드">
    <div class="shadow"></div>
    <div class="rot" id="rot">
      <div class="board">
        <div class="pcb back" style="transform:translateZ(calc(var(--t) * -1))"></div>
        <div class="pcb top"></div>

        <!-- QFN (U-something) at the bottom centre: its body was missing from the photo, so draw it on the pads.
             Body edges sit at the inner ends of the pins: x 387-433, y 652-700 (image px = viewBox units). -->
        <div class="ov chip">
          <svg viewBox="0 0 696 900" aria-hidden="true">
            <defs>
              <linearGradient id="qfnBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3c3f"/><stop offset="1" stop-color="#17181a"/></linearGradient>
            </defs>
            <rect x="387" y="652" width="46" height="48" rx="1.5" fill="url(#qfnBody)" stroke="#0b0b0c" stroke-width="0.8"/>
            <circle cx="391" cy="656" r="1.8" fill="#c9ced2" fill-opacity=".85"/>
          </svg>
        </div>
        <!-- three M2 round-head screws seated in the board's holes: top centre (316,45), bottom-left (52,845), bottom-right (640,845).
             Dome head with a hex socket, a shadow on the board and a soft highlight. -->
        <div class="ov bolts">
          <svg viewBox="0 0 696 900" aria-hidden="true">
            <defs>
              <radialGradient id="boltDome" cx=".35" cy=".3" r=".65"><!-- slightly glossier metal: brighter, tighter highlight and deeper edges -->
                <stop offset="0" stop-color="#f4f7fa"/><stop offset=".22" stop-color="#c9d0d6"/><stop offset=".5" stop-color="#8f99a1"/><stop offset=".8" stop-color="#5d676e"/><stop offset="1" stop-color="#3c434a"/>
              </radialGradient>
            </defs>
            <g id="bolts"></g>
          </svg>
        </div>
        <div class="ov fpc">
          <svg viewBox="0 0 696 900" aria-hidden="true">
            <defs>
              <linearGradient id="fx" x1="0" y1="0" x2="0" y2="1"><!-- across the ribbon: a rounded, slightly glossy film -->
                <stop offset="0" stop-color="#a86f08"/><stop offset=".3" stop-color="#f2b82a"/><stop offset=".5" stop-color="#ffd64a"/><stop offset=".7" stop-color="#e3a720"/><stop offset="1" stop-color="#9a6a0a"/>
              </linearGradient>
            </defs>
            <!-- soft shadow so the cable lifts off the board -->
            <path d="M265 150 L414 150 L442 98 L577 98 L577 333 L440 333 L414 278 L265 278 Z" fill="#000" fill-opacity=".38" filter="url(#blur)"/>
            <path d="M262 146 L411 146 L439 94 L574 94 L574 329 L437 329 L411 274 L262 274 Z"
                  fill="url(#fx)" fill-opacity=".95" stroke="#5e3d0a" stroke-opacity=".85" stroke-width="1.2"/>
            <g id="tr" fill="none" stroke="#fff1c2" stroke-opacity=".8" stroke-width="1.3"></g>
            <rect x="505" y="94" width="69" height="235" fill="#0a0a0b" fill-opacity=".96"/>
            <rect x="505" y="94" width="69" height="235" fill="none" stroke="#3a3b3d" stroke-width="1"/>
            <g id="ctc" fill="none" stroke="#8c9296" stroke-opacity=".55" stroke-width=".8"></g><!-- connector contacts (filled in script) -->
            <text transform="rotate(-18 452 292)" x="440" y="292" font-size="7" font-family="monospace" fill="#3a2a06" fill-opacity=".75">AEP 0315 64A</text><!-- printed part number on the ribbon -->
            <!-- the two mounting holes at the wide end: dark holes with a bright copper ring -->
            <circle cx="447" cy="105" r="3.6" fill="#2a1d05" stroke="#f5d88a" stroke-width="1.2"/>
            <circle cx="453" cy="318" r="3.6" fill="#2a1d05" stroke="#f5d88a" stroke-width="1.2"/>
            <rect x="262" y="159" width="71" height="96" fill="#050506" fill-opacity=".96"/>
          </svg>
        </div>

        <div class="ov g0"><div class="edge"></div></div>
        <div class="ov g1"><div class="edge"></div></div>
        <div class="ov g2"><div class="edge"></div></div>
        <div class="ov g3"><div class="edge"></div></div>
        <div class="ov glass">
          <svg viewBox="0 0 696 900" aria-hidden="true">
            <defs>
              <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
                <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
                <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
              </linearGradient>
            </defs>
            <rect x="10" y="20" width="260" height="385" rx="1.5" fill="#101012" fill-opacity=".9" stroke="#a9acab" stroke-opacity=".9" stroke-width="1.6"/>
            <rect x="16" y="26" width="206" height="374" rx="2" fill="#020203" fill-opacity=".92"/>
            <rect x="222" y="26" width="46" height="374" fill="#17181a" fill-opacity=".7"/>
            <rect x="222" y="119" width="46" height="136" fill="#000" fill-opacity=".9"/>
            <line x1="222" y1="22" x2="222" y2="403" stroke="#8d9091" stroke-opacity=".6" stroke-width="1.2"/>
            <rect x="10" y="20" width="260" height="385" rx="1.5" fill="url(#sheen)"/>
          </svg>
        </div>

        <!-- 3.5 cm gold spring antenna, pin in the yellow-ring pad, lying along the board notch (~16 px/mm) -->
        <div class="ov ant-s">
          <svg viewBox="0 0 696 900" aria-hidden="true">
            <defs><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter></defs>
            <rect x="602" y="0" width="86" height="560" rx="40" fill="#000" fill-opacity=".3" filter="url(#blur)" transform="translate(9 12)"/>
          </svg>
        </div>
        <div class="ov ant-b">
          <svg viewBox="0 0 696 900" aria-hidden="true">
            <defs>
              <linearGradient id="wireB" gradientUnits="userSpaceOnUse" x1="599" y1="0" x2="691" y2="0">
                <stop offset="0" stop-color="#6b5320"/><stop offset=".5" stop-color="#d1a94e"/><stop offset="1" stop-color="#6b5320"/>
              </linearGradient>
            </defs>
            <g id="ant-back" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
          </svg>
        </div>
        <div class="ov ant-f">
          <svg viewBox="0 0 696 900" aria-hidden="true">
            <defs>
              <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="599" y1="0" x2="691" y2="0">
                <stop offset="0" stop-color="#7a5c1c"/><stop offset=".28" stop-color="#f7dd8a"/><stop offset=".5" stop-color="#d9b15a"/><stop offset=".78" stop-color="#a07c2c"/><stop offset="1" stop-color="#5e4614"/>
              </linearGradient>
            </defs>
            <path d="M645 571 L645 551" stroke="#4a3a14" stroke-width="5.6" stroke-linecap="round" fill="none"/>
            <path d="M645 571 L645 551" stroke="#e7c56a" stroke-width="3.2" stroke-linecap="round" fill="none"/>
            <g id="ant-front" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
          </svg>
        </div>
        <!-- the two built-in LEDs on the board (white 0603 parts in board.png: top edge by the OLED, and next to Q5);
             lit in web mode 0 (brighter while the button is held) and while mode 13 blinks them -->
        <div class="ov case-glow"><svg viewBox="0 0 696 900" aria-hidden="true">
          <defs>
            <radialGradient id="caseGlowTop" gradientUnits="userSpaceOnUse" cx="445" cy="33" r="250">
              <stop offset="0" stop-color="#d6e6ff" stop-opacity=".55"/><stop offset=".35" stop-color="#d6e6ff" stop-opacity=".3"/>
              <stop offset=".7" stop-color="#d6e6ff" stop-opacity=".08"/><stop offset="1" stop-color="#d6e6ff" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="caseGlowBottom" gradientUnits="userSpaceOnUse" cx="257" cy="718" r="250">
              <stop offset="0" stop-color="#d6e6ff" stop-opacity=".55"/><stop offset=".35" stop-color="#d6e6ff" stop-opacity=".3"/>
              <stop offset=".7" stop-color="#d6e6ff" stop-opacity=".08"/><stop offset="1" stop-color="#d6e6ff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="696" height="900" fill="url(#caseGlowTop)"/>
          <rect width="696" height="900" fill="url(#caseGlowBottom)"/>
        </svg></div>
        <div class="ov leds">
          <svg viewBox="0 0 696 900" aria-hidden="true">
            <defs>
              <radialGradient id="ledGlow">
                <stop offset="0" stop-color="#fff" stop-opacity="1"/>
                <stop offset=".15" stop-color="#f4f8ff" stop-opacity=".85"/>
                <stop offset=".3" stop-color="#e8f1ff" stop-opacity=".55"/>
                <stop offset=".5" stop-color="#dfeaff" stop-opacity=".25"/>
                <stop offset=".7" stop-color="#d6e4ff" stop-opacity=".08"/>
                <stop offset=".85" stop-color="#cfe0ff" stop-opacity=".02"/>
                <stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>

            </defs>
            <g id="leds">
              <circle class="glow" cx="445" cy="33" r="44" fill="url(#ledGlow)"/>
              <rect x="433" y="26" width="24" height="14" rx="2" fill="#fff"/>
              <circle class="glow" cx="257" cy="718" r="44" fill="url(#ledGlow)"/>
              <rect x="245" y="711" width="24" height="14" rx="2" fill="#fff"/>
            </g>
          </svg>

        <div class="ov btn2"><svg id="btn-svg" viewBox="0 0 696 900" aria-hidden="true"></svg></div>
      </div>

      <!-- the lit digits / logo sit in front of the frosted lid (which tints everything behind it), so they stay at full white -->
      <div class="ov oled-top"><div class="oled-num" id="oled-num" aria-live="polite"></div></div>

<div class="picker" id="picker">
  <button type="button" class="picker-trigger" id="picker-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="picker-wheel">
    <span id="picker-value">–</span>
  </button>
  <div class="picker-panel">
    <div class="picker-view">
      <div class="picker-band"></div>
      <ul class="picker-wheel" id="picker-wheel" role="listbox" tabindex="0" aria-label="번호 선택"></ul>
    </div>
    <button type="button" class="picker-done" id="picker-done">완료</button>
  </div>

<script>
// number picker: tap the trigger, a wheel drops down; scroll (snaps to rows) or tap a row to choose.
// Numbers are one-per-phone: ones other people hold are greyed out live and can't be confirmed.
(() => {
  const ROW = 36, MAX = 45;
  // /rx?split (only the /split page uses it): operator preview. Any 01~45 can be picked to see/hear what that
  // number gets. Nothing is claimed on the server, so it never takes a seat from the audience.
  // The old /rx?admin address is gone: it now opens as an ordinary audience phone.
  const ADMIN = new URLSearchParams(location.search).has("split");
  window.rxAdmin = ADMIN;
  // Web phones carry the EVEN numbers (the LaNA boards carry the odd ones): the server still hands out seats
  // 1~45 first come, first served (sounds/shapes/notes are looked up by seat), but every phone shows and sends
  // seat × 2 = 02, 04 … 90 (OLED, picker and the presses TouchDesigner gets).
  const SHOWN = window.rxShown = (seat) => seat * 2;
  const root = document.getElementById("picker");
  const trigger = document.getElementById("picker-trigger");
  const label = document.getElementById("picker-value");
  const wheel = document.getElementById("picker-wheel");
  const done = document.getElementById("picker-done");
  let value = 1, settle, committed = null, taken = new Set(), busy = false;

  // the wheel's rows: 01~45
  const VALUES = Array.from({ length: MAX }, (_, i) => i + 1);
  window.rxNumberOk = (n) => VALUES.includes(n);
  const rowOf = (n) => Math.max(0, VALUES.indexOf(n));
  const atRow = (r) => VALUES[Math.max(0, Math.min(VALUES.length - 1, r))];
  for (const n of VALUES) {
    const li = document.createElement("li");
    li.textContent = String(SHOWN(n)).padStart(2, "0"); // 02~08 match the two-digit numbers
    li.setAttribute("role", "option");
    li.id = "picker-opt-" + n;
    wheel.appendChild(li);
  }
  const items = [...wheel.children];
  const isOpen = () => root.classList.contains("open");

  // curve the rows like a drum: tilt and fade with distance from the centre band
  const paint = () => {
    const mid = wheel.scrollTop / ROW;
    items.forEach((li, i) => {
      const d = Math.max(-3, Math.min(3, i - mid));
      li.style.transform = `rotateX(${(-d * 22).toFixed(1)}deg)`;
      li.style.opacity = (1 - Math.abs(d) * .26).toFixed(2);
    });
  };
  const two = (n) => String(SHOWN(n)).padStart(2, "0");
  const showLabel = () => { label.textContent = isOpen() ? two(value) : committed ? two(committed) : "–"; }; // "–" = no number yet (or all 40 taken)
  const refreshDone = (msg) => {
    const blocked = !ADMIN && taken.has(value); // admin preview can look at any number, held or not
    done.disabled = blocked || busy;
    done.textContent = msg || (blocked ? "이미 선택된 번호예요" : "완료");
  };
  const select = (v) => {
    value = VALUES.includes(v) ? v : atRow(v - 1);
    showLabel();
    items.forEach((li, i) => li.setAttribute("aria-selected", String(VALUES[i] === value)));
    wheel.setAttribute("aria-activedescendant", "picker-opt-" + value);
    refreshDone();
  };
  const scrollTo = (v, smooth) => wheel.scrollTo({ top: rowOf(v) * ROW, behavior: smooth ? "smooth" : "auto" });
  const inBand = () => atRow(Math.round(wheel.scrollTop / ROW)); // the number in the centre band

  wheel.addEventListener("scroll", () => {
    requestAnimationFrame(paint);
    clearTimeout(settle);
    settle = setTimeout(() => select(inBand()), 90);
  }, { passive: true });
  wheel.addEventListener("click", (e) => {
    const li = e.target.closest("li");
    if (li) scrollTo(VALUES[items.indexOf(li)], true);
  });
  wheel.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      scrollTo(atRow(rowOf(value) + (e.key === "ArrowDown" ? 1 : -1)), true);
    } else if (e.key === "Enter") confirm();
  });

  const open = () => {
    root.classList.add("open");
    trigger.setAttribute("aria-expanded", "true");
    if (committed) value = committed;
    scrollTo(value, false);
    select(value);
    paint();
    wheel.focus({ preventScroll: true });
  };
  const close = () => {
    clearTimeout(settle);
    root.classList.remove("open");
    trigger.setAttribute("aria-expanded", "false");
    showLabel();
  };
  // "완료": ask the server for the number; only a confirmed number goes on the OLED
  async function confirm() {
    if (!isOpen() || busy) return;
    clearTimeout(settle);
    select(inBand()); // take the row in the band even if the wheel hasn't settled
    if (ADMIN) {
      committed = value;
      try { localStorage.setItem("rx-admin-number", String(value)); } catch (_) {}
      window.rxSetNumber(committed);
      close();
      return;
    }
    if (taken.has(value)) return;
    busy = true; refreshDone("확인 중…");
    const r = await window.rxClaim(value);
    busy = false;
    if (r.ok) {
      committed = value;
      window.rxSetNumber(committed);
      close();
      trigger.focus();
    } else {
      refreshDone(r.message || "다시 시도해 주세요");
    }
  }

  // Normally numbers are handed out first come, first served and the pill only shows this phone's number.
  // The pill opens the wheel only while /tx has "번호 선택 모드" on (admin check option), on every phone
  // including the /split preview. First come, first served is the default: pill locked.
  let pickMode = false;
  const canPick = () => pickMode;
  const setPickable = () => {
    trigger.setAttribute("aria-haspopup", canPick() ? "listbox" : "false");
    trigger.setAttribute("aria-label", canPick() ? "번호 선택" : "내 번호");
    if (!canPick() && isOpen()) close();
  };
  trigger.addEventListener("click", () => { if (canPick()) (isOpen() ? close() : open()); });
  setPickable();
  done.addEventListener("click", confirm);
  document.addEventListener("pointerdown", (e) => { if (!root.contains(e.target)) close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

  // called by the show script: numbers held by other phones, and this phone's own number
  window.rxPicker = {
    setTaken(list, mine) {
      taken = new Set(list.filter((n) => n !== mine));
      items.forEach((li, i) => {
        const t = taken.has(VALUES[i]);
        li.classList.toggle("taken", t);
        li.setAttribute("aria-disabled", String(t));
      });
      if (isOpen()) refreshDone();
    },
    setCommitted(n) { committed = n; if (n) value = n; showLabel(); },
    setPickMode(on) { if (pickMode !== !!on) { pickMode = !!on; setPickable(); } },
  };

  select(1);
  showLabel();
  paint();
})();
</script>
<script>
// FPC traces: 30 lines fanning from the neck out to the contact pads
(() => {
  const g = document.getElementById("tr"), ns = "http://www.w3.org/2000/svg";
  // M2 round-head hex-socket (Allen) screws in the three holes (head radius 24 units, about 1.4 mm): a dark shadow, the dome, and a hex socket
  const bolts = document.getElementById("bolts");
  for (const [cx, cy] of [[316, 45], [52, 845], [640, 845]]) {
    const grp = document.createElementNS(ns, "g");
    grp.innerHTML =
      `<circle cx="${cx}" cy="${cy}" r="24" fill="url(#boltDome)" stroke="#2c3034" stroke-width="1"/>` +
      `<path d="M${cx - 16} ${cy - 6} Q${cx - 6} ${cy - 16} ${cx + 4} ${cy - 14}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>` +
      `<polygon points="${cx + 9},${cy} ${cx + 4.5},${cy + 7.8} ${cx - 4.5},${cy + 7.8} ${cx - 9},${cy} ${cx - 4.5},${cy - 7.8} ${cx + 4.5},${cy - 7.8}" fill="#101316" stroke="#0b0d0f" stroke-width="0.8"/>`;
    bolts.appendChild(grp);
  }
  // Conductors as in the photo: N copper traces leave the neck (x 333), run through a curved fan at the wide end and
  // end on an exposed pad at the connector's entry edge (x 509). Each trace is a dark outline with a bright copper core.
  const N = 18, ctc = document.getElementById("ctc");
  for (let i = 0; i < N; i++) {
    const y0 = 158 + i * (108 / (N - 1)), y1 = 104 + i * (215 / (N - 1));
    const d = `M333 ${y0.toFixed(1)} H396 C416 ${y0.toFixed(1)} 422 ${y1.toFixed(1)} 442 ${y1.toFixed(1)} H505`;
    for (const [stroke, w, op] of [["#6e4a0c", 2.4, .55], ["#fff3b8", 1.1, .9]]) {
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", d);
      p.setAttribute("stroke", stroke);
      p.setAttribute("stroke-width", w);
      p.setAttribute("stroke-opacity", op);
      g.appendChild(p);
    }
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", "509");
    c.setAttribute("cy", y1.toFixed(1));
    c.setAttribute("r", "2");
    c.setAttribute("fill", "#ffe9a0");
    c.setAttribute("stroke", "#6e4a0c");
    c.setAttribute("stroke-width", "0.6");
    ctc.appendChild(c);
  }
  // spring antenna: true helix projected top-down. ~16.6 px/mm (QFP 0.5 mm lead pitch = ~8.3 px)
  // coil diameter 20 % smaller than before (radius 46 -> 36.8 px, about 4.5 mm), pin into the pad at (645,571).
  // Wire 20 % thicker than before and the coils 20 % further apart (pitch 17.8 -> 21.4 px per turn).
  // Top end raised about 16 px (turns 23.75 -> 24.5, bottom start unchanged).
  const f = document.getElementById("ant-front"), b = document.getElementById("ant-back");
  // straight wire of 35 px straight up from the pad (645,571); the coil then starts on the centre line of the spring (t = -PI/2)
  // so the straight run and the first turn join smoothly. The top end stays at y = 28.
  const cx = 645, R = 36.8, pitch = 21.4, step = Math.PI / 16;
  const LEAD = 35, tStart = -Math.PI / 2, yStart = 571 - LEAD;
  const y0 = yStart + pitch * tStart / (2 * Math.PI); // so that the coil's first point lands at yStart
  const turns = (y0 - 19) / pitch;
  const mk = (pts, attrs) => {
    const el = document.createElementNS(ns, "path");
    el.setAttribute("d", "M" + pts.map((q) => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L"));
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };
  // a short straight wire leaves the pad (645,571) and only then the spring starts at the first coil point (cx+R, y0)
  let seg = [[645, 571]], front = true;
  const flush = () => {
    if (seg.length < 2) { seg = []; return; }
    if (front) {
      f.appendChild(mk(seg, { stroke: "#4a3a14", "stroke-width": 13.8 }));
      f.appendChild(mk(seg, { stroke: "url(#wire)", "stroke-width": 10.2 }));
      f.appendChild(mk(seg.map((q) => [q[0], q[1] - 2.8]), { stroke: "#fff6d6", "stroke-opacity": .6, "stroke-width": 2.16 }));
    } else {
      b.appendChild(mk(seg, { stroke: "#2e2410", "stroke-width": 10.8 }));
      b.appendChild(mk(seg, { stroke: "url(#wireB)", "stroke-width": 7.8 }));
    }
    seg = [];
  };
  for (let t = tStart; t <= turns * 2 * Math.PI + 1e-6; t += step) {
    const s = Math.sin(t), pt = [cx + R * Math.cos(t), y0 - pitch * t / (2 * Math.PI)];
    const isFront = s >= 0;
    if (front !== null && isFront !== front) { seg.push(pt); flush(); }
    front = isFront;
    seg.push(pt);
  }
  flush();

  // push button, pre-drawn as one flat SVG (the page is a fixed front view, so only the silhouette shows).
  // Board px: 16.61 px/mm, axis x=115, y = -(mm above the board's top edge). Proportions from the photo:
  // collar 8.85 dia | nut 7.2 across corners x 1.75 | smooth concave flare 2.2 -> 6 (no thread, as in the photo) | plunger 2.2 x 1.8 | cap 4.1 x 2.9
  const svg = document.getElementById("btn-svg");
  const BASE_PX = 16.61, K = 1.12; // K: whole-button scale (10% + 5% larger, then 3% smaller)
  const PX = BASE_PX * K, AX = 101, W = 1.26; // W = case top wall, mm above the board edge (stays where it was)
  const Y = (mm) => (-mm * PX + W * (PX - BASE_PX)).toFixed(1), X = (mm) => (AX + mm * PX).toFixed(1);
  const RAD = Math.PI / 180, PH = 105;
  const c = (th, ph = PH) => Math.cos((th - ph) * RAD);
  const sp = (th, p, ph = PH) => Math.pow(Math.max(0, c(th, ph)), p);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  // a cylinder seen side-on: left edge is theta=180, centre 90, right 0
  const stops = (L) => Array.from({ length: 25 }, (_, i) => {
    const u = i / 24, th = Math.acos(clamp(1 - 2 * u, -1, 1)) / RAD; // u=0 -> 0deg? flip so left=180
    return `<stop offset="${u.toFixed(3)}" stop-color="hsl(210 6% ${L(180 - th).toFixed(1)}%)"/>`;
  }).join("");
  const chromeL = (th) => clamp(36 + 14 * c(th) + 50 * sp(th, 40) + 14 * sp(th, 6) - 24 * sp(th, 18, 55) - 16 * sp(th, 18, 150) + 22 * sp(th, 10, 18) + 16 * sp(th, 10, 172), 12, 98);
  const glossL = (th) => clamp(7 + 7 * c(th) + 48 * sp(th, 26), 3, 80);
  const NR = 3.6; // nut circumradius; flat face toward the viewer spans -R/2..R/2
  // whole button stretched 10% wider, around the button's own axis (AX)
  svg.innerHTML = `
    <g transform="translate(${AX} 0) scale(1.064 1) translate(${-AX} 0)">
    <defs>
      <linearGradient id="chr" x1="0" y1="0" x2="1" y2="0">${stops(chromeL)}</linearGradient>
      <linearGradient id="blk" x1="0" y1="0" x2="1" y2="0">${stops(glossL)}</linearGradient>
      <linearGradient id="capTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
      <linearGradient id="nutFace" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="hsl(210 5% 72%)"/><stop offset=".14" stop-color="hsl(210 6% 93%)"/>
        <stop offset=".5" stop-color="hsl(0 0% 99%)"/><stop offset=".86" stop-color="hsl(210 6% 93%)"/><stop offset="1" stop-color="hsl(210 5% 72%)"/>
      </linearGradient>
    </defs>
    <!-- collar (rounded top), mostly behind the board -->
    <rect x="${X(-4.42)}" y="${Y(W)}" width="${(8.84 * PX).toFixed(1)}" height="${(W * PX + 12).toFixed(1)}" rx="${(.35 * PX).toFixed(1)}" fill="url(#chr)"/>
    <!-- hex nut: left face, front face, right face, then chamfer highlights -->
    <rect x="${X(-NR)}" y="${Y(W + 1.54)}" width="${(NR / 2 * PX).toFixed(1)}" height="${(1.54 * PX).toFixed(1)}" fill="hsl(210 4% 60%)"/>
    <rect x="${X(NR / 2)}" y="${Y(W + 1.54)}" width="${(NR / 2 * PX).toFixed(1)}" height="${(1.54 * PX).toFixed(1)}" fill="hsl(210 4% 48%)"/>
    <rect x="${X(-NR / 2)}" y="${Y(W + 1.54)}" width="${(NR * PX).toFixed(1)}" height="${(1.54 * PX).toFixed(1)}" fill="url(#nutFace)"/>
    <rect x="${X(-NR)}" y="${Y(W + 1.54)}" width="${(2 * NR * PX).toFixed(1)}" height="2.2" fill="#fff" fill-opacity=".45"/>
    <rect x="${X(-NR)}" y="${(+Y(W) - 2.2).toFixed(1)}" width="${(2 * NR * PX).toFixed(1)}" height="2.2" fill="#000" fill-opacity=".25"/>
    <!-- everything above the nut (cap, stem, flare, thread band) drops 0.35 mm, the same amount the nut was reduced -->
    <g transform="translate(0 ${(.21 * PX).toFixed(1)})">
    <!-- plunger + cap: the part that moves. Drawn before the bushing and flare so that, pressed in,
         the plunger slides down inside them instead of covering the thread -->
    <g id="press" class="press">
      <!-- invisible touch/click target, about 8 mm x 11 mm around the cap (the cap alone is ~4 mm wide): fingers and mice
           hit the button without needing the exact cap. Moves with the plunger; pointer capture keeps the release. -->
      <rect x="${X(-4)}" y="${Y(W + 12.1)}" width="${(8 * PX).toFixed(1)}" height="${(11 * PX).toFixed(1)}" rx="${(1.5 * PX).toFixed(1)}" fill="transparent" pointer-events="all"/>
      <rect x="${X(-1.25)}" y="${Y(W + 6.0)}" width="${(2.5 * PX).toFixed(1)}" height="${(1.4 * PX).toFixed(1)}" fill="url(#chr)"/>
      <rect x="${X(-2.05)}" y="${Y(W + 8.45)}" width="${(4.1 * PX).toFixed(1)}" height="${(2.5 * PX).toFixed(1)}" rx="${(.45 * PX).toFixed(1)}" fill="url(#blk)"/>
      <rect x="${X(-2.05)}" y="${Y(W + 6.35)}" width="${(4.1 * PX).toFixed(1)}" height="${(.4 * PX).toFixed(1)}" fill="url(#capTop)" transform="rotate(180 ${AX} ${Y(W + 6.15)})"/>
    </g>
    <!-- concave flare from the stem down to the nut (the photo has no threaded band above the nut) -->
    <path d="M${X(-1.25)} ${Y(W + 4.6)} C${X(-1.25)} ${Y(W + 3.7)} ${X(-1.6)} ${Y(W + 3.0)} ${X(-2.1)} ${Y(W + 2.6)}
             L${X(2.1)} ${Y(W + 2.6)} C${X(1.6)} ${Y(W + 3.0)} ${X(1.25)} ${Y(W + 3.7)} ${X(1.25)} ${Y(W + 4.6)} Z" fill="url(#chr)"/>
    <!-- short threaded band between the flare and the nut, with two faint crests -->
    <rect x="${X(-2.1)}" y="${Y(W + 2.6)}" width="${(4.2 * PX).toFixed(1)}" height="${(1.2 * PX).toFixed(1)}" fill="url(#chr)"/>
    <line x1="${X(-2.1)}" x2="${X(2.1)}" y1="${Y(W + 2.0)}" y2="${Y(W + 2.0)}" stroke="#000" stroke-opacity=".3" stroke-width="1.6"/>
    <line x1="${X(-2.1)}" x2="${X(2.1)}" y1="${Y(W + 2.3)}" y2="${Y(W + 2.3)}" stroke="#000" stroke-opacity=".3" stroke-width="1.6"/>
    </g>
    </g>`;
  const press = document.getElementById("press");
  // press/hold the cap: plunger travels in ~1.2 mm while held and springs back on release, and "클릭" flashes on the OLED
  const msg = document.getElementById("oled-msg");
  let holding = false, downAt = 0;
  const onDown = (e) => {
    if (holding) return;
    if (e.button !== undefined && e.button !== 0) return;
    holding = true;
    downAt = Date.now();
    clearTimeout(press._t);
    press.classList.add("down");
    try { if (e.pointerId !== undefined) press.setPointerCapture(e.pointerId); } catch (_) {}
    document.dispatchEvent(new Event("rx-press")); // single-press modes
    document.dispatchEvent(new Event("rx-down"));  // hold-to-sustain mode (mode 10)
    msg.classList.remove("show");
    void msg.offsetWidth;
    msg.classList.add("show");
  };
  const onUp = () => {
    if (!holding) return;
    holding = false;
    clearTimeout(press._t);
    const wait = Math.max(0, 110 - (Date.now() - downAt));
    press._t = setTimeout(() => press.classList.remove("down"), wait);
    document.dispatchEvent(new Event("rx-up"));
  };
  press.addEventListener("pointerdown", onDown);
  addEventListener("pointerup", onUp);
  addEventListener("pointercancel", onUp);
  addEventListener("blur", onUp);

<script>
/*
 * ============================================================================

 *    12   | 도형 / 도~솔 (번호 없음)          | 누르는 동안 도레미파솔 (DOREMI 음원)

 *    14   | 번호 / 도형 / 음 이름 (쌓아서)    | 누르면 짧은 음 (NOTE_OF)
 *    15   | 음 이름만                         | 누르는 동안 음 (NOTE_OF 루프)
 *    16   | 도형 / 음 이름                    | 누르면 짧은 음 (NOTE_OF)
 *    17   | 도형 / 도~솔                      | 누르는 동안 도레미파솔
 *    18   | 도~솔 이름만                      | 누르는 동안 도레미파솔
 *    ※ 모드 번호 표 기준과 OLED·소리 구현 번호가 다르다 (INNER_MODE 참고). 이 표는 서버 번호를 쓴다.

 *

 *      정하는 것은 별도 결정이다.
 *
 * 9. 검증 방법
 *    - split.html 미리보기와 rxAdmin 미리보기 (rxPush 로 푸시를 손으로 재현)에서 모드 전환 타이밍과 LED 플래시를 확인한 뒤 옮긴다.
 *    - 기기 두 대 이상을 같은 서버에 붙여 LED 플래시와 음원 시작이 동시에 나오는지 확인한다.

// Follow the show: /tx sets the mode, every phone's OLED shows what that mode calls for (DEVICE table, 미니패널 column).
(() => {
  const oled = document.getElementById("oled-num");
  // Modes 7~10: each number gets one of the 5 recorded notes (C, D, Eb, G, Bb), 9 numbers each, shuffled once
  // with a fixed seed so neighbouring numbers never share a note and every block of 10 has all 5.
  // Modes 8~10 match each of the 5 notes 1-to-1 with one of the 5 shapes (○ △ □ ☆ ✕).
  const NOTE_OF = [null,
    "G","Eb","G","C","Eb","C","G","D","Bb","D",
    "G","C","G","C","Bb","G","D","Bb","Eb","C",
    "D","Bb","D","Eb","G","C","Eb","Bb","D","Bb",
    "D","G","Bb","D","Eb","Bb","Eb","C","Eb","C",
    "D","G","Eb","Bb","C"]; // 41~45: one of each note, none next to the same note

  // Web mode 12: the same shape per number, sounding 도 레 미 파 솔 (C4~G4) instead: ○ 도, △ 레, □ 미, ☆ 파, ✕ 솔
  const DOREMI_FOR_NOTE = { C: "C", D: "D", Eb: "E", G: "F", Bb: "G" };
  const DOREMI_OF = NOTE_OF.map((n) => (n ? DOREMI_FOR_NOTE[n] : null));

  // shape it has in the other chapter 3 modes, so its melody follows that shape.

  const SHAPE_FOR_MELODY = { 1: "○", 2: "△", 3: "□", 4: "☆", 5: "✕" };

  // /tx now has modes 0~11 (old 9, 10 and 13 removed, dingdong moved up to 8). The code below still uses the old
  // 14-mode numbers, so the server's 8 / 9 / 10 / 11 are read as the old 14 (dingdong) / 8 (number + shape, note) /
  // 11 (melody) / 12 (hold).

  // web 15 (음계만) is 18 here: the note name alone on the panel, the same short note as web 9 on press
  // web 16 (도형+음계) is 19: shape / note name, short note on press. Web 9 (J) uses it too now (no number);
  // web 14 (O, → 터디) keeps 8 (number + shape + note)
  // web 17 (도형+도레미파솔) is 20: shape / 도~솔, 도레미파솔 while held (web 12 without the number)
  // web 18 (도레미파솔) is 21: 도~솔 alone, 도레미파솔 while held. Web 12 (M) uses 20 (shape / 도~솔, no number)
  const inner = (s) => (s && INNER_MODE[s.mode] ? { ...s, mode: INNER_MODE[s.mode] } : s);

  // mode 0 logo with its dot pattern: white on transparent, 2000x1418; the ink (dots included) spans x 256..1626, y 337..1168.
  // The "BUFFER 버퍼" letters (x 460..1537, y 617..801, centre 998.5 / 709) sit at the panel's centre: the viewBox is
  // the smallest box centred on them that still holds every dot.
  // Turned 90° left and scaled up (same proportions) to fill the lit area (not the grey strip); only the
  // sparse outer dots are cropped (text spans x 465..1540, y 615..800 of the image).
  const LOGO = `<svg class="oled-logo" viewBox="398 -1560 617 1120" role="img" aria-label="BUFFER 버퍼"><image href="/assets/rx/mode0-logo.webp" width="2000" height="1418" transform="rotate(-90)"/></svg>`;
  const NOTE_K = 0.7; // P (단음) and S (도레미파솔): the letter at 70 % of the panel-filling size
  function paint() {
    const mode = state ? state.mode : 1; // no server (e.g. the shared preview link): behave like mode 1

      const shape = (mode === 8 || mode === 12) ? `<span class="oled-shape${SHAPE_OF[number] === "△" ? " tri" : ""}">${SHAPE_OF[number]}</span>` : "";
      html = `<span class="oled-line"><span class="oled-n">${num}</span>${shape}<span class="oled-note">${NOTE_OF[number]}</span></span>`;
    }

  }

  // Mode 9: the shape alone, its ink scaled to SHAPE_FILL of the panel and centred by the ink itself
  // (○ △ □ ☆ ✕ each sit differently inside their letter box).
  const SHAPE_FILL = 0.8;
  function fitShape() {
    const el = oled.querySelector(".oled-shape-only");

        const { taken, pickMode } = JSON.parse(e.data);
        applyClaims(taken, number && !taken.includes(number) ? null : undefined, pickMode);
      } catch (_) {}
    });
  } catch (_) {}

  setInterval(pull, 1000); // safety net if a Realtime push is missed
  setInterval(pullClaims, 4000);
  pull();

  // Modes 7~9: pressing the cap plays this person's short note once (recorded C, D, Eb, G, Bb);
  // holding the button does not repeat it — you must release and press again to trigger again.
  // Mode 10: a single press plays the 2.5-second extended version of this person's note (mode10-hold-*.mp3).
  // Mode 11: a single press plays this person's melody (1.wav … 4.wav from "sos 음정/멜로디", 4 groups).
  // Mode 12: shared fade-out (1 s hold + 3 s fade).
  const notePlayers = {};
  const notePlayer = (src) => {
    if (!notePlayers[src]) { notePlayers[src] = new Audio(src); notePlayers[src].preload = "auto"; }
    return notePlayers[src];
  };
  let nowNote = null;
  const sounding = (a) => a && !a.paused && !a.ended;
  // Button sounds play through Web Audio once the file is decoded: an iPhone lets an <audio> element sound only
  // after it was started from inside a tap once, so a mode's new files (after /tx switched) stayed silent until a
  // reload. Web Audio, once woken by any tap, plays every decoded file. <audio> stays only as the fallback while a
  // file is still loading. One voice per slot ("note": notes / melodies, "main": main sound / 띵동).
  const shots = {};
  const shotSounding = (slot) => !!shots[slot] && performance.now() < shots[slot].endAt;
  function stopShot(slot) {
    const v = shots[slot];
    shots[slot] = null;
    if (v) { try { v.node.stop(); } catch (_) {} }
  }
  // true when it went through Web Audio (or was ignored because the same sound is still playing)
  function playShot(slot, src, restartOnPress) {
    const b = ready[src];
    if (!b || !actx || actx.state === "closed") { loadBuf(src); return false; }
    if (shotSounding(slot)) {
      if (shots[slot].src === src && !restartOnPress) return true;
      stopShot(slot);
    }
    try {
      const node = actx.createBufferSource();
      node.buffer = b;
      node.connect(actx.destination);
      node.start(); // if the phone is still waking its audio, this plays the moment it is running
      shots[slot] = { node, src, endAt: performance.now() + b.duration * 1000 };
      return true;
    } catch (_) { return false; }
  }
  function playSrc(src, restartOnPress = false) {
    stopHold7(true);
    stopHold12(true);
    wakeAudio();
    if (sounding(nowNote) && ready[src]) nowNote.pause();
    if (playShot("note", src, restartOnPress)) return;
    const next = notePlayer(src);
    if (shotSounding("note")) { if (shots.note.src === src && !restartOnPress) return; stopShot("note"); }
    if (sounding(nowNote)) {
      if (nowNote === next && !restartOnPress) return;
      nowNote.pause();
    }
    nowNote = next;
    try { nowNote.loop = false; nowNote.volume = 1; nowNote.currentTime = 0; } catch (_) {}
    nowNote.play().catch(() => {});
  }
  // Short note (web mode 9, here 8): one press plays the note once; presses while it still sounds are ignored
  // (same as the melody in web mode 10), so mashing the button can't re-trigger it
  const play = (note) => playSrc(`/assets/rx/mode67-note-${note}.mp3`, false);
  // 3-second extended note (mode 10): one press plays the full 3 s extended note
  const playLong = (note) => playSrc(`/assets/rx/mode10-hold-${note}.mp3`, false);
  // Melody 1~4 (mode 11): one press plays the melody
  const playMelody = (mel) => playSrc(`/assets/rx/mode11-melody-${mel}.mp3`, false);

  // ---- mode 12 fade-out & hold-to-sustain (Web Audio) ----
  // Mode 12 starts with full volume; after 15s, it linearly fades out over 10s to 0; after 25s it is silent.
  // Holding the button down sustains the note continuously at the current fadeout volume level.
  const FADE12_HOLD_S = 15, FADE12_FADE_S = 10;
  const fade12Start = () => (state && state.mode === 12 ? state.updatedAtMs + FADE12_HOLD_S * 1000 : 0); // server ms
  const fade12End = () => (state && state.mode === 12 ? fade12Start() + FADE12_FADE_S * 1000 : 0);
  const fade12Level = () => {
    if (!state || state.mode !== 12) return 0;
    const now = Date.now() + offset;
    const s = fade12Start(), e = fade12End();
    if (now < s) return 1;
    if (now >= e) return 0;
    return Math.max(0, Math.min(1, (e - now) / (FADE12_FADE_S * 1000)));
  };

  let actx = null;
  const wakeAudio = () => {
    try {
      // iPhones: let Web Audio play even with the ringer switch on silent, like the <audio> sounds do
      if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback";
      if (actx && actx.state === "closed") actx = null; // iOS can close it after a long time in the background
      if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
      // iPhones also use "interrupted" (screen off, idle, a call), not only "suspended": wake it from either
      if (actx && actx.state !== "running") actx.resume().catch(() => {});
    } catch (_) {}
  };
  for (const ev of ["pointerdown", "touchend", "click"]) addEventListener(ev, wakeAudio, true); // only a tap may start it
  const buffers = {}, ready = {};
  function loadBuf(src) {
    if (!buffers[src]) {
      if (!actx) wakeAudio();
      buffers[src] = !actx ? Promise.resolve(null) : fetch(src).then((r) => r.arrayBuffer())
        .then((b) => new Promise((ok, no) => actx.decodeAudioData(b, ok, no)))
        .then((b) => (ready[src] = b))
        .catch(() => { delete buffers[src]; return null; });
    }
    return buffers[src];
  }

  // mode12-loop-*.mp3 (recorded notes) loop whole. mode12-doremi-*.mp3 (web 12) is a 4 s steady tone where any
  // 3 s stretch holds whole cycles, so it repeats 0.5..3.5 s: seamless, and the MP3's own padding at both ends
  // never plays again after the first pass.
  const loopSrc = (note) => `/assets/rx/mode12-loop-${note}.mp3`;
  const doremiSrc = (n) => `/assets/rx/mode12-doremi-${DOREMI_OF[n]}.mp3`;
  // The recorded notes (mode12-loop-*) used to loop whole, but the jump from the file's end back to its start is
  // not seamless (the waveform doesn't match, and iPhones add a few ms of MP3 padding there), so a held note went
  // "띠~~~ 띠". So each one gets its own loop copy: it loops from ~0.25-0.4 s (the point whose lead-in best
  // matches the end, so the two line up in phase) to 0.25 s before the end, and the last 0.15 s before the loop end
  // is cross-faded (linear: the two are in phase) into the 0.15 s just before the loop start. At the jump the sound
  // is then already what comes right before the start: no click, no new attack, level steady within ~0.5 dB.
  const XF = 0.15, LOOP_IN = 0.3, LOOP_OUT = 0.25;
  const looped = new WeakMap();
  function loopBuf(b, src) {
    if (src.includes("-doremi-") || !actx || b.duration < LOOP_IN + LOOP_OUT + 1) return { buf: b, start: src.includes("-doremi-") ? 0.5 : 0, end: src.includes("-doremi-") ? Math.min(3.5, b.duration) : b.duration };
    if (looped.has(b)) return looped.get(b);
    const sr = b.sampleRate, e0 = b.length - Math.floor(LOOP_OUT * sr), F = Math.floor(XF * sr);
    const d0 = b.getChannelData(0), tail = d0.subarray(e0 - F, e0);
    let s0 = Math.floor(LOOP_IN * sr), bestC = -Infinity;
    for (let s = Math.floor(0.25 * sr); s <= Math.floor(0.4 * sr); s++) {
      let c = 0;
      for (let k = 0; k < F; k += 4) c += tail[k] * d0[s - F + k];
      if (c > bestC) { bestC = c; s0 = s; }
    }
    const out = actx.createBuffer(b.numberOfChannels, e0, sr);
    for (let c = 0; c < b.numberOfChannels; c++) {
      const d = b.getChannelData(c), o = out.getChannelData(c);
      o.set(d.subarray(0, e0));
      for (let k = 0; k < F; k++) {
        const a = (k + 1) / F; // 0 -> 1 across the fade
        o[e0 - F + k] = d[e0 - F + k] * (1 - a) + d[s0 - F + k] * a;
      }
    }
    const r = { buf: out, start: s0 / sr, end: e0 / sr };
    looped.set(b, r);
    return r;
  }
  // Mode 7: hold to sustain continuously for opened numbers; stops when released or number closes
  let holdVoice7 = null; // { node, gain, startedAt, audio }
  function stopHold7(immediate) {
    if (!holdVoice7) return;
    const v = holdVoice7;
    holdVoice7 = null;
    if (v.audio) {
      v.audio.pause();
      v.audio.loop = false;
      return;
    }
    if (!actx) return;
    try {
      const t = actx.currentTime;
      if (immediate) { v.node.stop(t); return; }
      v.gain.gain.cancelScheduledValues(t);
      v.gain.gain.setValueAtTime(v.level || 1, t);
      v.gain.gain.linearRampToValueAtTime(0, t + 0.08); // smooth natural 80ms release on release
      v.node.stop(t + 0.09);
    } catch (_) {}
  }

  // also web 12 (도레미파솔): same hold-to-sustain, given the doremi file as src. The doremi tones are a plain,
  // steady low tone that sounds quieter on phone speakers than the recorded notes, so they play +6 dB (×2).
  const DOREMI_GAIN = 2;
  function startHold7(src) {
    stopHold7(true);
    if (sounding(nowNote)) nowNote.pause();
    stopShot("note");
    wakeAudio();
    const b = ready[src];
    if (b && actx && actx.state !== "closed") {
      const node = actx.createBufferSource();
      const gain = actx.createGain();
      const t = actx.currentTime;
      const lp = loopBuf(b, src);
      node.buffer = lp.buf;
      node.loop = true;
      node.loopStart = lp.start;
      node.loopEnd = lp.end;
      const level = src.includes("-doremi-") ? DOREMI_GAIN : 1;
      gain.gain.setValueAtTime(level, t);
      node.connect(gain).connect(actx.destination);
      node.start(t, 0);
      holdVoice7 = { node, gain, startedAt: t, level };
      return;
    }
    loadBuf(src);
    const a = notePlayer(src);
    try {
      a.volume = 1;
      a.currentTime = 0;
      a.loop = true;
      a.play().catch(() => {});
    } catch (_) {}
    holdVoice7 = { audio: a };
  }

  // Mode 12: hold to sustain continuously; volume follows the 15s hold -> 10s fadeout curve
  let holdVoice12 = null; // { node, gain, startedAt, audio }
  function stopHold12(immediate) {
    if (!holdVoice12) return;
    const v = holdVoice12;
    holdVoice12 = null;
    if (v.audio) {
      v.audio.pause();
      v.audio.loop = false;
      return;
    }
    if (!actx) return;
    try {
      const t = actx.currentTime;
      if (immediate) { v.node.stop(t); return; }
      v.gain.gain.cancelScheduledValues(t);
      const cur = fade12Level();
      v.gain.gain.setValueAtTime(cur, t);
      v.gain.gain.linearRampToValueAtTime(0, t + 0.08); // smooth natural 80ms release on release
      v.node.stop(t + 0.09);
    } catch (_) {}
  }

  function startHold12(note) {
    const k = fade12Level();
    if (k <= 0) return; // past 25s: silent
    stopHold12(true);
    if (sounding(nowNote)) nowNote.pause();
    stopShot("note");
    wakeAudio();
    const src = `/assets/rx/mode12-loop-${note}.mp3`;
    const b = ready[src];
    const now = Date.now() + offset;
    if (b && actx && actx.state !== "closed") {
      const node = actx.createBufferSource();
      const gain = actx.createGain();
      const t = actx.currentTime;
      const holdTime = t + Math.max(0, fade12Start() - now) / 1000;
      const endTime = t + Math.max(0, fade12End() - now) / 1000;
      const lp = loopBuf(b, src);
      node.buffer = lp.buf;
      node.loop = true;
      node.loopStart = lp.start;
      node.loopEnd = lp.end;
      gain.gain.setValueAtTime(k, t);
      if (holdTime > t) gain.gain.setValueAtTime(k, holdTime);
      gain.gain.linearRampToValueAtTime(0, endTime);
      node.connect(gain).connect(actx.destination);
      node.start(t, 0);
      node.stop(endTime + 0.05);
      holdVoice12 = { node, gain, startedAt: t };
      return;
    }
    loadBuf(src);
    const a = notePlayer(src);
    try {
      a.volume = k;
      a.currentTime = 0;
      a.loop = true;
      a.play().catch(() => {});
    } catch (_) {}
    holdVoice12 = { audio: a };
  }

  // stop mode 7 / 12 voices if leaving mode or closed, or adjust HTML5 audio fallback volume
  setInterval(() => {
    const m = state ? state.mode : 1;
    // every held-note mode keeps its voice (7 only while the number is open): 17 / 20 / 21 (도레미파솔), 18 (P 단음)
    const holdMode = m === 17 || m === 18 || m === 20 || m === 21 || (m === 7 && number && mode7Open(number));
    if (!holdMode && holdVoice7) stopHold7(true);
    if (m === 20 && holdVoice7 && number && !shapeOpen(number)) stopHold7(false); // /tx moved on to another shape
    if (m === 12 && holdVoice12 && number && !shapeOpen(number)) stopHold12(false);
    if (m !== 12 && holdVoice12) stopHold12(true);
    if (m === 12 && holdVoice12 && holdVoice12.audio) {
      const k = fade12Level();
      try { holdVoice12.audio.volume = k; } catch (_) {}
      if (k <= 0) stopHold12(true);
    }
  }, 100);

  // preload this phone's chapter 3 audio as soon as the show reaches chapter 3, so the first press sounds at once
  setInterval(() => {
    const m = state ? state.mode : 1;
    if ((m === 7 || m === 12 || m === 18) && number && NOTE_OF[number]) { const ls = loopSrc(NOTE_OF[number]); if (ready[ls] && actx) loopBuf(ready[ls], ls); }
    if ((m === 17 || m === 20 || m === 21) && number) { notePlayer(doremiSrc(number)); loadBuf(doremiSrc(number)); return; } // web 12, 17, 18
    if (m === 18 && number && NOTE_OF[number]) { notePlayer(loopSrc(NOTE_OF[number])); loadBuf(loopSrc(NOTE_OF[number])); return; } // web 15: held note
    if (m === 19 && number && NOTE_OF[number]) { notePlayer(`/assets/rx/mode67-note-${NOTE_OF[number]}.mp3`); return; } // web 16
    if (m < 7 || m > 12 || !number || !NOTE_OF[number]) return;
    notePlayer(`/assets/rx/mode67-note-${NOTE_OF[number]}.mp3`);
    notePlayer(`/assets/rx/mode12-loop-${NOTE_OF[number]}.mp3`);
    loadBuf(`/assets/rx/mode12-loop-${NOTE_OF[number]}.mp3`);
    if (m >= 9) {
      notePlayer(`/assets/rx/mode10-hold-${NOTE_OF[number]}.mp3`);
      notePlayer(`/assets/rx/mode11-melody-${MELODY_OF[number]}.mp3`);
    }
  }, 500); // the cap only sounds in chapter 3 (modes 7~12) and chapter 4 (13, 14); in modes 1~6 the press just animates

  // Chapter 4, mode 13: each number owns one of the 9 main sounds (지원 지민 승환 승영 세령 선율 봄 민 수아),
  // shuffled once with a fixed seed: 4–5 numbers per sound, never the same sound on neighbouring numbers.
  // Every press plays this phone's sound from the top. Only that one file loads, once the show reaches mode 13.
  const MAIN_OF = [null,
    "seunghwan","jiwon","min","seryeong","bom","sua","seonyul","jiwon","seonyul","jimin",
    "seryeong","jimin","seungyoung","min","seungyoung","bom","sua","jiwon","sua","seunghwan",
    "jimin","seonyul","bom","min","seonyul","sua","seunghwan","bom","jimin","jiwon",
    "min","seungyoung","seryeong","seungyoung","seonyul","seunghwan","jiwon","sua","seryeong","min"];
  const mainSrc = () => (number ? `/assets/rx/mode8-${MAIN_OF[number]}.mp3` : null); // no number chosen: silent
  const mainPlayers = {};
  let nowMain = null;
  function mainPlayer(src) {
    if (!mainPlayers[src]) { mainPlayers[src] = new Audio(src); mainPlayers[src].preload = "auto"; }
    return mainPlayers[src];
  }
  function playMain() {
    const src = mainSrc();
    if (!src) return;
    wakeAudio();
    if (playShot("main", src, false)) { if (sounding(nowMain)) nowMain.pause(); return; }
    const next = mainPlayer(src);
    if (sounding(nowMain)) { if (nowMain === next) return; nowMain.pause(); }
    nowMain = next;
    try { nowMain.currentTime = 0; } catch (_) {}
    nowMain.play().catch(() => {});
  }
  // Mode 14: a press plays the 띵동 (띵동 변조 2.wav), same for everyone; presses during it are ignored.
  const DINGDONG = "/assets/rx/mode9-dingdong.mp3";
  function playDingdong() {
    wakeAudio();
    if (playShot("main", DINGDONG, false)) { if (sounding(nowMain)) nowMain.pause(); return; }
    const next = mainPlayer(DINGDONG);
    if (sounding(nowMain)) { if (nowMain === next) return; nowMain.pause(); }
    nowMain = next;
    try { nowMain.currentTime = 0; } catch (_) {}
    nowMain.play().catch(() => {});
  }
  function syncMain() {
    const mode = state ? state.mode : 1;
    if (mode === 13) { const src = mainSrc(); if (src) mainPlayer(src); } // start downloading this phone's sound
    else if (mode === 14) mainPlayer(DINGDONG);
    if (nowMain && mode !== 13 && mode !== 14) { nowMain.pause(); nowMain = null; } // leaving these modes silences it
    if (mode !== 13 && mode !== 14 && shotSounding("main")) stopShot("main");
    // decode this phone's button sounds ahead of time (once the audio exists), so a press after /tx switches a mode
    // plays at once through Web Audio. Each file is fetched and decoded once.
    if (actx && number) {
      const note = NOTE_OF[number];
      for (const src of [
        note && `/assets/rx/mode67-note-${note}.mp3`, note && `/assets/rx/mode10-hold-${note}.mp3`,
        note && `/assets/rx/mode12-loop-${note}.mp3`, MELODY_OF[number] && `/assets/rx/mode11-melody-${MELODY_OF[number]}.mp3`,
        DOREMI_OF[number] && doremiSrc(number), mainSrc(), DINGDONG,
      ]) if (src) loadBuf(src);
    }
  }
  setInterval(syncMain, 500);

  // EVERY mode switch: the built-in LEDs go dark for SWITCH_OFF_MS, then come back on for SWITCH_ON_MS (an instant
  // off -> on, no fade), and only then the mode's own LED rule starts. The switch moment is the server's updatedAtMs
  // (written by /tx), so every phone flashes at the same time. A phone that opens mid-show never sees a flash, because
  // its first state is taken as "already running", not as a switch.
  // Web mode 13 (LED 13 in the DEVICE table): after the flash, the LEDs blink 5 times, 0.2 s on / 0.2 s off (2 s in all).
  // Web mode 0: the LEDs stay lit; pressing the button turns them up to full, and on release they ease back down.
  // Every other mode: the LEDs stay dark after the flash. The panel and the button are not affected.
  const SWITCH_OFF_MS = 300, SWITCH_ON_MS = 300, SWITCH_FLASH_MS = SWITCH_OFF_MS + SWITCH_ON_MS;
  const leds = document.getElementById("leds");
  let ledHeld = false;
  let ledSeenUpdated = undefined, ledSwitchMs = null; // ledSwitchMs: server-clock ms of the latest mode switch
  document.addEventListener("rx-down", () => { ledHeld = true; });
  document.addEventListener("rx-up", () => { ledHeld = false; });
  setInterval(() => {
    const m = state ? state.mode : -1;
    if (state && typeof state.updatedAtMs === "number" && state.updatedAtMs !== ledSeenUpdated) {
      if (ledSeenUpdated !== undefined) ledSwitchMs = state.updatedAtMs; // a later update = /tx switched the mode
      ledSeenUpdated = state.updatedAtMs;
    }
    const since = ledSwitchMs === null ? -1 : Date.now() + offset - ledSwitchMs; // ms since the switch, server clock
    let op = 0, glow = "1", tr = "none";
    if (since >= 0 && since < SWITCH_FLASH_MS) {
      op = since < SWITCH_OFF_MS ? 0 : 1; // off, then on (instant)
    } else if (m === 15) {
      const t = since - SWITCH_FLASH_MS; // the 5 blinks start once the flash is over
      op = t >= 0 && t < 2000 && Math.floor(t / 200) % 2 === 0 ? 1 : 0;
    } else if (m === 0) {
      // on: a quick, eased rise with a halo (1.6x when held; 2.4x made a big smear that lingered as an afterimage)
      // off: a short ease-out back to the idle level, so no halo hangs around after release
      op = ledHeld ? 1 : 0.5; // idle level lowered from 0.8 to 0.5 (the case glow follows this level too)
      glow = ledHeld ? "1.6" : "1";
      tr = ledHeld ? "opacity .1s ease-out, transform .1s ease-out" : "opacity .45s ease-out, transform .45s ease-out";
    }
    if (leds.style.transition !== tr) leds.style.transition = tr;
    if (leds.style.getPropertyValue("--glow") !== glow) leds.style.setProperty("--glow", glow);
    if (leds.style.opacity !== String(op)) leds.style.opacity = String(op);
    // the inside of the case lights up around each LED: the glow layer follows the LED level
    const lit = op.toFixed(3);
    if (document.documentElement.style.getPropertyValue("--lit") !== lit) document.documentElement.style.setProperty("--lit", lit);
  }, 20);

  // Mode 7 is opened number by number from /tx, following the numbers on the stage monitor:
  // each number is switched on / off on its own: bits 0~4 = 17, 32, 11, 31, 10, bit 5 = everyone.
  // Older server (no open7): everyone.
  const MODE7_ORDER = [17, 32, 11, 31, 10];
  const mode7Open = (n) => {
    const mask = state && typeof state.open7 === "number" ? state.open7 : 63;
    if (mask & 32) return true;
    const i = MODE7_ORDER.indexOf(n);
    return i >= 0 && !!(mask & (1 << i));
  };
  // shape modes (J K L M O Q R): /tx picks the shape that sounds now (open7 bits 0~4 = ○ △ □ ☆ ✕, 32 = 전체)
  const SHAPES = ["○", "△", "□", "☆", "✕"];
  const shapeOpen = (n) => {
    const mask = state && typeof state.open7 === "number" ? state.open7 : 32;
    if (mask & 32) return true;
    const i = SHAPES.indexOf(SHAPE_OF[n]);
    return i >= 0 && !!(mask & (1 << i));
  };
  document.addEventListener("rx-press", () => {
    const mode = state ? state.mode : 1;
    if ((mode === 8 || mode === 11 || mode === 19) && number && !shapeOpen(number)) return; // not this shape's turn
    // mode 6 is "everything off": no panel, no sound on press
    // mode 7: handled by rx-down / rx-up (hold to sustain for open numbers)
    if ((mode === 8 || mode === 9 || mode === 19) && number) play(NOTE_OF[number]); // 8 & 9 (and web 16): short note (5 groups)
    else if (mode === 10 && number) playLong(NOTE_OF[number]);            // 10: 2.5-second extended note (5 groups)
    else if (mode === 11 && number) playMelody(MELODY_OF[number]);        // 11: melody 1~5 (5 groups)
    // mode 12: handled by rx-down / rx-up (hold to sustain, 15s hold -> 10s fadeout)
    else if (mode === 13) playMain();
    else if (mode === 14) playDingdong();
  });
  document.addEventListener("rx-down", () => {
    const mode = state ? state.mode : 1;
    if ((mode === 12 || mode === 20) && number && !shapeOpen(number)) return; // not this shape's turn
    if (mode === 7 && number && mode7Open(number)) startHold7(loopSrc(NOTE_OF[number]));
    else if (mode === 18 && number) startHold7(loopSrc(NOTE_OF[number])); // web 15 (P 단음): the note sounds only while held, short or long
    else if ((mode === 17 || mode === 20 || mode === 21) && number) startHold7(doremiSrc(number)); // web 12, 17, 18: 도레미파솔 while held
    else if (mode === 12 && number) startHold12(NOTE_OF[number]);
  });
  document.addEventListener("rx-up", () => {
    const mode = state ? state.mode : 1;
    if (mode === 7 || mode === 17 || mode === 18 || mode === 20 || mode === 21) stopHold7(false);
    else if (mode === 12) stopHold12(false);
  });
  // In the background (screen off, another app) an iPhone keeps playing what already sounds, but this page's code
  // stops running, so it can't hear /tx switch modes: a looping 발화 went on into the next mode. So going to the
  // background silences everything; coming back asks the server and rejoins whatever the current mode plays.
  function silenceAll() {
    clearTimeout(trackTimer);
    trackKey = null; // so coming back starts the current track again (joining mid-way like a late phone)
    stopFades();
    stopAll();
    stopShot("note"); stopShot("main");
    stopHold7(true); stopHold12(true);
    if (sounding(nowNote)) nowNote.pause();
    if (nowMain) { nowMain.pause(); nowMain = null; }
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) silenceAll(); else { pull(); pullClaims(); } });
  addEventListener("pagehide", silenceAll);
})();
</script>
